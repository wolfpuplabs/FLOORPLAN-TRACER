<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan Tracer - BIM Architect</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        /* CSS Reset untuk Touch Behavior */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        /* Kecualikan input agar masih bisa diketik */
        input[type="number"], input[type="text"], select {
            -webkit-user-select: text;
            user-select: text;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Helvetica, sans-serif; 
            background: #f4f4f5; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            touch-action: none; 
        }
        
        /* Redesign UI/UX Layout */
        #top-ui {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            flex-wrap: wrap;
        }

        .toolbar-row:not(:last-child) {
            border-bottom: 1px solid #e4e4e7;
            background: #fafafa;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f4f4f5;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #d4d4d8;
        }

        button, select, input[type="number"], input[type="file"]::file-selector-button { 
            padding: 6px 12px; 
            cursor: pointer; 
            border: 1px solid #d4d4d8; 
            background: #ffffff; 
            border-radius: 4px; 
            font-size: 13px; 
            color: #3f3f46;
            transition: 0.15s; 
        }

        input[type="file"]::file-selector-button {
            background: #f4f4f5;
        }

        input[type="number"] { 
            cursor: text; 
            background: #fff; 
            width: 50px;
        }

        button:hover, select:hover, input[type="file"]::file-selector-button:hover { 
            background: #e4e4e7; 
        }

        button:disabled { 
            cursor: not-allowed; 
            opacity: 0.4; 
        }

        button.active { 
            background: #2563eb; 
            color: white; 
            border-color: #1d4ed8; 
            font-weight: 600; 
        }
        
        .btn-action { background: #f4f4f5; font-weight: 500; }
        .btn-danger { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
        .btn-danger:hover { background: #fecaca; }
        .btn-primary { background: #10b981; color: white; border-color: #059669; font-weight: bold; }
        .btn-primary:hover { background: #059669; }
        .btn-purple { background: #8b5cf6; color: white; border-color: #7c3aed; font-weight: bold; }
        .btn-purple:hover { background: #7c3aed; }
        
        .spacer { flex-grow: 1; }
        .divider { width: 1px; height: 24px; background-color: #d4d4d8; margin: 0 4px; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; }
        #left-panel { flex: 1; position: relative; background: #e4e4e7; overflow: hidden; border-right: 2px solid #a1a1aa; touch-action: none; cursor: crosshair; }
        #right-panel { flex: 1; position: relative; background: #18181b; }

        #workspace { transform-origin: 0 0; position: relative; }
        #floorplan-img { display: block; max-width: none; pointer-events: none; }
        #draw-canvas { position: absolute; top: 0; left: 0; }

        #instructions { 
            position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.7); 
            color: white; padding: 10px 15px; border-radius: 6px; font-size: 12px; 
            pointer-events: none; z-index: 20; line-height: 1.5; border: 1px solid rgba(255,255,255,0.2); 
        }

        #edit-panel {
            display: none; position: absolute; top: 15px; right: 15px; background: white; 
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            z-index: 100; width: 240px; border: 1px solid #d4d4d8; max-height: 80vh; overflow-y: auto;
        }
        
        #edit-panel h4 { margin: 0 0 12px 0; border-bottom: 1px solid #e4e4e7; padding-bottom: 8px; color: #18181b; }
        #edit-panel label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #3f3f46; }
        #edit-panel input[type="range"] { width: 100%; margin-bottom: 12px; accent-color: #2563eb; }
        .edit-btn-danger { background: #ef4444; color: white; width: 100%; border: none; padding: 8px; border-radius: 4px; font-weight: bold; margin-top: 10px; }
        .edit-btn-danger:hover { background: #dc2626; }

        #ar-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
        }
        model-viewer { width: 90vw; height: 80vh; background-color: #111; border-radius: 8px; }
        
        #closeArBtn {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: #ef4444; color: white;
            border: none; border-radius: 6px; font-weight: bold; font-size: 14px; z-index: 1001;
        }

        @media (max-width: 900px) {
            #main-container { flex-direction: column; }
            #left-panel, #right-panel { flex: none; height: 50%; border-right: none; border-bottom: 2px solid #a1a1aa; }
            #edit-panel { top: auto; bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <div id="top-ui">
        <!-- Baris 1: Sistem & File -->
        <div class="toolbar-row">
            <input type="file" id="upload" accept="image/*" style="max-width: 200px;">
            
            <div class="divider"></div>
            
            <div class="tool-group">
                <button id="undoBtn" class="btn-action" disabled>Undo</button>
                <button id="redoBtn" class="btn-action" disabled>Redo</button>
                <button id="clearBtn" class="btn-danger">Hapus Semua</button>
            </div>

            <div class="spacer"></div>
            
            <button id="arBtn" class="btn-purple">View AR</button>
            <button id="exportBtn" class="btn-primary">Export GLB</button>
        </div>

        <!-- Baris 2: Alat Gambar & Objek -->
        <div class="toolbar-row">
            <div class="tool-group">
                <button id="modeSelect">Pilih / Edit</button>
            </div>
            
            <div class="tool-group">
                <button id="modeWall" class="active">Gambar Tembok</button>
                <button id="modeDoor">Pintu</button>
                <button id="modeWindow">Jendela</button>
                <button id="modeStairs">Tangga</button>
            </div>
            
            <select id="furnitureSelect">
                <option value="">+ Tambah Mebel...</option>
                <optgroup label="Ruang Utama">
                    <option value="bed">Kasur</option>
                    <option value="sofa">Sofa</option>
                    <option value="table">Meja</option>
                    <option value="chair">Kursi</option>
                </optgroup>
                <optgroup label="Dapur">
                    <option value="kitchen_set">Kitchen Set</option>
                    <option value="stove">Kompor</option>
                    <option value="fridge">Kulkas</option>
                </optgroup>
                <optgroup label="Kamar Mandi">
                    <option value="toilet">Kloset / Toilet</option>
                    <option value="shower">Shower</option>
                    <option value="bathtub">Bathtub</option>
                </optgroup>
            </select>
            
            <div class="divider"></div>
            
            <div class="tool-group" style="background: transparent; border: none;">
                <label style="font-size:12px; font-weight:600;">Tinggi(m): <input type="number" id="valWallH" value="3.0" step="0.1"></label>
                <label style="font-size:12px; font-weight:600; margin-left: 5px;">Tebal(m): <input type="number" id="valWallT" value="0.15" step="0.05"></label>
            </div>
        </div>
    </div>

    <div id="edit-panel">
        <h4 id="editTitle">Parameter Objek</h4>
        
        <div id="wallObjectControls">
            <label>Posisi Tembok: <span id="valPos">50</span>%</label>
            <input type="range" id="editPos" min="0" max="100" step="1" value="50">

            <label>Lebar: <span id="valWidth">0.9</span> m</label>
            <input type="range" id="editWidth" min="0.4" max="4.0" step="0.1" value="0.9">
            
            <div id="doorControls">
                <label>Rotasi (Swing): <span id="valSwing">45</span>°</label>
                <input type="range" id="editSwing" min="-180" max="180" step="5" value="45">
                <button id="flipHingeBtn" style="width: 100%; margin-bottom: 10px; background: #e4e4e7; font-weight: 500;">Balik Engsel</button>
            </div>
        </div>

        <div id="freeObjectControls">
            <label>Rotasi: <span id="valRot">0</span>°</label>
            <input type="range" id="editRot" min="0" max="360" step="5" value="0">

            <label>Skala Ukuran: <span id="valScale">1.0</span>x</label>
            <input type="range" id="editScale" min="0.5" max="3.0" step="0.1" value="1.0">

            <div id="stairsControls">
                <label>Jumlah Anak Tangga: <span id="valSteps">14</span></label>
                <input type="range" id="editSteps" min="5" max="25" step="1" value="14">

                <label>Lebar Tangga: <span id="valStairW">1.0</span> m</label>
                <input type="range" id="editStairW" min="0.8" max="2.5" step="0.1" value="1.0">
            </div>
        </div>

        <button id="delObjBtn" class="edit-btn-danger">Hapus Objek</button>
    </div>

    <div id="ar-modal">
        <button id="closeArBtn">Tutup AR</button>
        <model-viewer id="arViewer" ar ar-modes="webxr scene-viewer quick-look" camera-controls touch-action="pan-y" shadow-intensity="1" alt="Denah 3D AR">
            <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; left: 16px; padding: 12px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                Lihat di Ruangan Nyata (AR)
            </button>
        </model-viewer>
    </div>

    <div id="main-container">
        <div id="left-panel">
            <div id="workspace">
                <img id="floorplan-img" src="">
                <canvas id="draw-canvas"></canvas>
            </div>
            <div id="instructions">
                <b>Mode Tembok:</b><br>
                1. Tap/Klik 1x untuk titik awal.<br>
                2. Tap/Klik di titik lain untuk menyambung.<br>
                3. Tap 2x di posisi yang sama (Atau ESC/Klik Kanan) untuk memutus garis.
            </div>
        </div>
        <div id="right-panel"></div>
    </div>

    <script>
        // === STATE & DATA ===
        let lines = []; 
        let openings = []; 
        let freeObjects = [];
        let mode = 'wall'; 
        let scale3D = 0.02; 
        
        let selectedItem = null;
        let isDraggingObject = false; 
        let undoStack = []; let redoStack = [];

        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const imgElement = document.getElementById('floorplan-img');
        const leftPanel = document.getElementById('left-panel');
        
        const inputWallH = document.getElementById('valWallH');
        const inputWallT = document.getElementById('valWallT');
        const furnitureSelect = document.getElementById('furnitureSelect');

        inputWallH.addEventListener('change', () => { saveState(); update3D(); });
        inputWallT.addEventListener('change', () => { saveState(); update3D(); draw2D(); });

        // === UNDO / REDO LOGIC ===
        function saveState() {
            undoStack.push({ 
                lines: JSON.parse(JSON.stringify(lines)), 
                openings: JSON.parse(JSON.stringify(openings)),
                freeObjects: JSON.parse(JSON.stringify(freeObjects))
            });
            redoStack = []; 
            document.getElementById('undoBtn').disabled = false; document.getElementById('redoBtn').disabled = true;
        }

        function restoreState(isUndo) {
            stopDrawing();
            const current = { 
                lines: JSON.parse(JSON.stringify(lines)), 
                openings: JSON.parse(JSON.stringify(openings)),
                freeObjects: JSON.parse(JSON.stringify(freeObjects))
            };
            if (isUndo) {
                redoStack.push(current); const prev = undoStack.pop();
                lines = prev.lines; openings = prev.openings; freeObjects = prev.freeObjects || [];
            } else {
                undoStack.push(current); const next = redoStack.pop();
                lines = next.lines; openings = next.openings; freeObjects = next.freeObjects || [];
            }
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
            selectedItem = null; closeEditPanel(); draw2D(); update3D();
        }

        document.getElementById('undoBtn').onclick = () => restoreState(true);
        document.getElementById('redoBtn').onclick = () => restoreState(false);

        // === ZOOM & PAN 2D LOGIC ===
        let scale = 1; let panX = 0, panY = 0; let isPanning = false, startPanX = 0, startPanY = 0;
        let touchStartDist = 0, initialScale = 1;

        function applyTransform() { workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }

        leftPanel.addEventListener('wheel', (e) => {
            e.preventDefault();
            const newScale = Math.min(Math.max(0.05, scale + (e.deltaY * -0.001)), 10);
            const rect = leftPanel.getBoundingClientRect();
            const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
            panX = mouseX - ((mouseX - panX) * (newScale / scale)); panY = mouseY - ((mouseY - panY) * (newScale / scale));
            scale = newScale; applyTransform();
        }, { passive: false });

        leftPanel.addEventListener('pointerdown', (e) => {
            if (e.button === 2 || e.button === 1) { 
                isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY;
                leftPanel.style.cursor = 'grabbing';
            }
        });
        
        window.addEventListener('pointerup', () => { 
            isPanning = false; 
            if (isDraggingObject) { isDraggingObject = false; saveState(); }
            leftPanel.style.cursor = 'crosshair'; 
        });
        
        window.addEventListener('pointermove', (e) => { 
            if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyTransform(); }
        });
        
        leftPanel.addEventListener('contextmenu', e => e.preventDefault());

        // Multi-Touch Logic
        leftPanel.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                isPanning = true;
                touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                initialScale = scale;
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2; const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                startPanX = midX - panX; startPanY = midY - panY;
            }
        }, { passive: false });

        leftPanel.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault(); 
                const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2; const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                const newScale = Math.min(Math.max(0.05, initialScale * (currentDist / touchStartDist)), 10);
                const rect = leftPanel.getBoundingClientRect();
                const focusX = midX - rect.left; const focusY = midY - rect.top;
                panX = focusX - ((focusX - (midX - startPanX)) * (newScale / scale)); panY = focusY - ((focusY - (midY - startPanY)) * (newScale / scale));
                scale = newScale; applyTransform();
            }
        }, { passive: false });
        leftPanel.addEventListener('touchend', () => { 
            isPanning = false; 
            if (isDraggingObject) { isDraggingObject = false; saveState(); }
        });

        // === UI EDITOR & INTERAKSI KANVAS ===
        let isDrawing = false, currentLine = null;
        const SNAP_RADIUS = 20;

        function stopDrawing() {
            isDrawing = false;
            currentLine = null;
            draw2D();
        }

        document.getElementById('modeSelect').onclick = (e) => setMode('select', e.target);
        document.getElementById('modeWall').onclick = (e) => setMode('wall', e.target);
        document.getElementById('modeDoor').onclick = (e) => setMode('door', e.target);
        document.getElementById('modeWindow').onclick = (e) => setMode('window', e.target);
        document.getElementById('modeStairs').onclick = (e) => setMode('stairs', e.target);

        furnitureSelect.addEventListener('change', (e) => {
            if(e.target.value) {
                setMode(e.target.value, null);
            }
        });

        function setMode(newMode, btn) {
            stopDrawing();
            mode = newMode;
            document.querySelectorAll('#top-ui button.active').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            if (mode !== 'select') closeEditPanel();
            draw2D();
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { stopDrawing(); }
        });

        function getTrueCoords(x, y) {
            const rect = canvas.getBoundingClientRect();
            return { x: (x - rect.left) * (canvas.width / rect.width), y: (y - rect.top) * (canvas.height / rect.height) };
        }

        function getSnapped(x, y) {
            let snapX = x, snapY = y; let minDist = SNAP_RADIUS / scale;
            for (let l of lines) {
                if (Math.hypot(l.start.x - x, l.start.y - y) < minDist) { return { x: l.start.x, y: l.start.y }; }
                if (Math.hypot(l.end.x - x, l.end.y - y) < minDist) { return { x: l.end.x, y: l.end.y }; }
            }
            for (let l of lines) {
                const l2 = Math.pow(l.end.x - l.start.x, 2) + Math.pow(l.end.y - l.start.y, 2);
                if (l2 === 0) continue;
                let t = Math.max(0, Math.min(1, ((x - l.start.x) * (l.end.x - l.start.x) + (y - l.start.y) * (l.end.y - l.start.y)) / l2));
                const projX = l.start.x + t * (l.end.x - l.start.x); const projY = l.start.y + t * (l.end.y - l.start.y);
                const dist = Math.hypot(x - projX, y - projY);
                if (dist < minDist) { minDist = dist; snapX = projX; snapY = projY; }
            }
            return { x: snapX, y: snapY };
        }

        function handlePointerDown(clientX, clientY, button) {
            if (button === 2) {
                stopDrawing();
                return; 
            }
            if (button !== 0 && button !== undefined) return;

            let { x, y } = getTrueCoords(clientX, clientY);
            
            if (mode === 'select') {
                let clickedItem = null; let minDist = 30 / scale;
                
                openings.forEach(op => {
                    let l = lines[op.lineIndex];
                    if(l) {
                        const cx = l.start.x + (l.end.x - l.start.x) * op.ratio;
                        const cy = l.start.y + (l.end.y - l.start.y) * op.ratio;
                        if (Math.hypot(cx - x, cy - y) < minDist) { clickedItem = op; minDist = Math.hypot(cx - x, cy - y); }
                    }
                });

                freeObjects.forEach(obj => {
                    if (Math.hypot(obj.x - x, obj.y - y) < minDist) {
                        clickedItem = obj; minDist = Math.hypot(obj.x - x, obj.y - y);
                    }
                });

                if (clickedItem) { 
                    selectedItem = clickedItem; 
                    openEditPanel(selectedItem); 
                    if (selectedItem.lineIndex === undefined) {
                        isDraggingObject = true; 
                    }
                } 
                else { selectedItem = null; closeEditPanel(); }
                draw2D();
            } 
            else if (mode === 'wall') {
                let snap = getSnapped(x, y);
                if (!isDrawing) {
                    saveState(); 
                    isDrawing = true; 
                    currentLine = { start: snap, end: snap };
                } else {
                    const dist = Math.hypot(snap.x - currentLine.start.x, snap.y - currentLine.start.y);
                    
                    if (dist < 10 / scale) {
                        stopDrawing();
                    } else {
                        currentLine.end = snap;
                        lines.push({...currentLine});
                        update3D();
                        currentLine = { start: snap, end: snap };
                    }
                }
                draw2D();
            } 
            else if (mode === 'door' || mode === 'window') {
                let nearest = findNearestLine(x, y);
                if (nearest) {
                    saveState(); 
                    openings.push({
                        id: Date.now(), type: mode, lineIndex: nearest.index, ratio: nearest.ratio,
                        width3D: mode === 'door' ? 0.9 : 1.2, height3D: mode === 'door' ? 2.1 : 1.2, 
                        elevation: mode === 'door' ? 0 : 0.9, swing: 85, flipHinge: false
                    });
                    update3D(); draw2D();
                }
            }
            else { 
                saveState();
                freeObjects.push({
                    id: Date.now(), type: mode, x: x, y: y,
                    rotation: 0, scaleVal: 1.0, steps: 14,
                    width3D: mode === 'stairs' ? 1.0 : 1.0
                });
                furnitureSelect.value = "";
                setMode('select', document.getElementById('modeSelect'));
                update3D(); draw2D();
            }
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (isPanning) return;
            handlePointerDown(e.clientX, e.clientY, e.button);
        });

        function handlePointerMove(clientX, clientY) {
            let { x, y } = getTrueCoords(clientX, clientY);
            if (isDrawing && mode === 'wall' && currentLine) {
                currentLine.end = getSnapped(x, y); 
                draw2D();
            }
            else if (isDraggingObject && selectedItem && selectedItem.lineIndex === undefined) {
                selectedItem.x = x;
                selectedItem.y = y;
                draw2D(); update3D();
            }
        }

        canvas.addEventListener('pointermove', (e) => {
            handlePointerMove(e.clientX, e.clientY);
        });

        function findNearestLine(px, py) {
            let minDist = 30 / scale; let result = null;
            lines.forEach((l, index) => {
                const l2 = Math.pow(l.end.x - l.start.x, 2) + Math.pow(l.end.y - l.start.y, 2);
                if (l2 === 0) return;
                let t = Math.max(0, Math.min(1, ((px - l.start.x) * (l.end.x - l.start.x) + (py - l.start.y) * (l.end.y - l.start.y)) / l2));
                const projX = l.start.x + t * (l.end.x - l.start.x); const projY = l.start.y + t * (l.end.y - l.start.y);
                const dist = Math.hypot(px - projX, py - projY);
                if (dist < minDist) { minDist = dist; result = { index, ratio: t }; }
            });
            return result;
        }

        // === PANEL EDITOR ===
        const editPanel = document.getElementById('edit-panel');
        const wallObjectControls = document.getElementById('wallObjectControls');
        const freeObjectControls = document.getElementById('freeObjectControls');
        const stairsControls = document.getElementById('stairsControls');
        
        const editPos = document.getElementById('editPos');
        const editWidth = document.getElementById('editWidth');
        const editSwing = document.getElementById('editSwing');
        const editRot = document.getElementById('editRot');
        const editScale = document.getElementById('editScale');
        const editSteps = document.getElementById('editSteps');
        const editStairW = document.getElementById('editStairW');

        function openEditPanel(item) {
            editPanel.style.display = 'block';
            
            if (item.lineIndex !== undefined) { 
                wallObjectControls.style.display = 'block';
                freeObjectControls.style.display = 'none';
                
                editPos.value = Math.round(item.ratio * 100); document.getElementById('valPos').innerText = Math.round(item.ratio * 100);
                editWidth.value = item.width3D; document.getElementById('valWidth').innerText = item.width3D;
                if (item.type === 'door') {
                    document.getElementById('doorControls').style.display = 'block';
                    editSwing.value = item.swing; document.getElementById('valSwing').innerText = item.swing;
                } else { document.getElementById('doorControls').style.display = 'none'; }
            } else { 
                wallObjectControls.style.display = 'none';
                freeObjectControls.style.display = 'block';
                
                editRot.value = item.rotation || 0; document.getElementById('valRot').innerText = item.rotation || 0;
                editScale.value = item.scaleVal || 1.0; document.getElementById('valScale').innerText = item.scaleVal || 1.0;

                if (item.type === 'stairs') {
                    stairsControls.style.display = 'block';
                    editSteps.value = item.steps || 14; document.getElementById('valSteps').innerText = item.steps || 14;
                    editStairW.value = item.width3D || 1.0; document.getElementById('valStairW').innerText = item.width3D || 1.0;
                } else {
                    stairsControls.style.display = 'none';
                }
            }
        }

        function closeEditPanel() { editPanel.style.display = 'none'; selectedItem = null; }

        editPos.addEventListener('input', (e) => { if (selectedItem && selectedItem.lineIndex !== undefined) { selectedItem.ratio = parseFloat(e.target.value) / 100; document.getElementById('valPos').innerText = e.target.value; update3D(); draw2D(); } });
        editPos.addEventListener('change', () => saveState());
        editWidth.addEventListener('input', (e) => { if (selectedItem && selectedItem.lineIndex !== undefined) { selectedItem.width3D = parseFloat(e.target.value); document.getElementById('valWidth').innerText = selectedItem.width3D; update3D(); draw2D(); } });
        editWidth.addEventListener('change', () => saveState());
        editSwing.addEventListener('input', (e) => { if (selectedItem && selectedItem.type === 'door') { selectedItem.swing = parseFloat(e.target.value); document.getElementById('valSwing').innerText = selectedItem.swing; update3D(); draw2D(); } });
        editSwing.addEventListener('change', () => saveState());
        editRot.addEventListener('input', (e) => { if (selectedItem && selectedItem.lineIndex === undefined) { selectedItem.rotation = parseInt(e.target.value); document.getElementById('valRot').innerText = selectedItem.rotation; update3D(); draw2D(); } });
        editRot.addEventListener('change', () => saveState());
        editScale.addEventListener('input', (e) => { if (selectedItem && selectedItem.lineIndex === undefined) { selectedItem.scaleVal = parseFloat(e.target.value); document.getElementById('valScale').innerText = selectedItem.scaleVal; update3D(); draw2D(); } });
        editScale.addEventListener('change', () => saveState());
        editSteps.addEventListener('input', (e) => { if (selectedItem && selectedItem.type === 'stairs') { selectedItem.steps = parseInt(e.target.value); document.getElementById('valSteps').innerText = selectedItem.steps; update3D(); draw2D(); } });
        editSteps.addEventListener('change', () => saveState());
        editStairW.addEventListener('input', (e) => { if (selectedItem && selectedItem.type === 'stairs') { selectedItem.width3D = parseFloat(e.target.value); document.getElementById('valStairW').innerText = selectedItem.width3D; update3D(); draw2D(); } });
        editStairW.addEventListener('change', () => saveState());

        document.getElementById('flipHingeBtn').addEventListener('click', () => {
            if (selectedItem && selectedItem.type === 'door') {
                saveState(); selectedItem.flipHinge = !selectedItem.flipHinge; update3D(); draw2D();
            }
        });

        document.getElementById('delObjBtn').addEventListener('click', () => {
            if (selectedItem) { 
                saveState(); 
                if (selectedItem.lineIndex !== undefined) openings = openings.filter(o => o.id !== selectedItem.id); 
                else freeObjects = freeObjects.filter(o => o.id !== selectedItem.id);
                closeEditPanel(); update3D(); draw2D(); 
            }
        });

        // === 2D RENDER ===
        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.lineCap = 'round';
            const globalThick2D = parseFloat(inputWallT.value) / scale3D;
            ctx.lineWidth = Math.max(2, globalThick2D); 
            
            ctx.strokeStyle = 'rgba(37, 99, 235, 0.45)';
            lines.forEach(l => { ctx.beginPath(); ctx.moveTo(l.start.x, l.start.y); ctx.lineTo(l.end.x, l.end.y); ctx.stroke(); });

            if (isDrawing && currentLine) { 
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.65)'; 
                ctx.beginPath(); ctx.moveTo(currentLine.start.x, currentLine.start.y); ctx.lineTo(currentLine.end.x, currentLine.end.y); ctx.stroke(); 
            }

            openings.forEach(op => {
                let l = lines[op.lineIndex]; if(!l) return;
                const angle = Math.atan2(l.end.y - l.start.y, l.end.x - l.start.x);
                const cx = l.start.x + (l.end.x - l.start.x) * op.ratio; const cy = l.start.y + (l.end.y - l.start.y) * op.ratio;
                const opWidth2D = op.width3D / scale3D; 

                ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
                if (op.flipHinge) { ctx.scale(-1, 1); }

                if (op === selectedItem) {
                    ctx.shadowColor = '#2563eb'; ctx.shadowBlur = 15; ctx.fillStyle = 'rgba(37, 99, 235, 0.4)';
                    ctx.fillRect(-opWidth2D/2, -ctx.lineWidth, opWidth2D, ctx.lineWidth*2);
                }

                if (op.type === 'door') {
                    ctx.clearRect(-opWidth2D/2, -ctx.lineWidth, opWidth2D, ctx.lineWidth * 2);
                    let swingDir = op.swing >= 0 ? -1 : 1;
                    
                    ctx.beginPath(); ctx.moveTo(-opWidth2D/2, 0); ctx.lineTo(-opWidth2D/2, opWidth2D * swingDir); 
                    ctx.lineWidth = Math.max(2, canvas.width * 0.002); ctx.strokeStyle = '#8B4513'; ctx.stroke();
                    ctx.beginPath(); ctx.arc(-opWidth2D/2, 0, opWidth2D, swingDir < 0 ? -Math.PI/2 : 0, swingDir < 0 ? 0 : Math.PI/2);
                    ctx.strokeStyle = 'rgba(139, 69, 19, 0.6)'; ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(14, 165, 233, 0.8)'; const th = ctx.lineWidth * 1.5;
                    ctx.fillRect(-opWidth2D/2, -th/2, opWidth2D, th); ctx.strokeStyle = '#333';
                    ctx.lineWidth = 1; ctx.strokeRect(-opWidth2D/2, -th/2, opWidth2D, th);
                }
                ctx.restore();
            });

            freeObjects.forEach(obj => {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate((obj.rotation || 0) * Math.PI / 180);
                const s = obj.scaleVal || 1.0;

                if (obj === selectedItem) {
                    ctx.shadowColor = '#2563eb'; ctx.shadowBlur = 15;
                }

                if (obj.type === 'stairs') {
                    const w = ((obj.width3D || 1.0) / scale3D) * s;
                    const h = (1.5 / scale3D) * s;
                    ctx.fillStyle = 'rgba(212, 212, 216, 0.8)';
                    ctx.fillRect(-w/2, -h/2, w, h);
                    ctx.strokeStyle = '#3f3f46'; ctx.lineWidth = 1.5;
                    ctx.strokeRect(-w/2, -h/2, w, h);
                    const steps = obj.steps || 14;
                    for(let i=1; i<steps; i++) {
                        let yStep = -h/2 + (h/steps)*i;
                        ctx.beginPath(); ctx.moveTo(-w/2, yStep); ctx.lineTo(w/2, yStep); ctx.stroke();
                    }
                } else {
                    const size = (30 / scale) * s;
                    ctx.fillStyle = ['bed','sofa','table','chair'].includes(obj.type) ? '#f59e0b' : 
                                    (['kitchen_set','stove','fridge'].includes(obj.type) ? '#ec4899' : '#06b6d4');
                    ctx.fillRect(-size/2, -size/2, size, size);
                    ctx.strokeStyle = '#27272a'; ctx.lineWidth = 1;
                    ctx.strokeRect(-size/2, -size/2, size, size);
                    
                    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.max(10, size*0.4)}px sans-serif`;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    const labels = { bed:'BED', sofa:'SOFA', table:'TBL', chair:'CHR', kitchen_set:'KIT', stove:'STV', fridge:'FRG', toilet:'WC', shower:'SHW', bathtub:'BAT' };
                    ctx.fillText(labels[obj.type] || 'OBJ', 0, 0);
                }
                ctx.restore();
            });
        }

        // === AUTO FIT IMAGE ===
        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imgElement.src = event.target.result;
                imgElement.onload = () => {
                    canvas.width = imgElement.width; canvas.height = imgElement.height;
                    const panelWidth = leftPanel.clientWidth; const panelHeight = leftPanel.clientHeight;
                    scale = Math.min(panelWidth / imgElement.width, panelHeight / imgElement.height) * 0.9;
                    panX = (panelWidth - (imgElement.width * scale)) / 2; panY = (panelHeight - (imgElement.height * scale)) / 2;
                    applyTransform();
                    scale3D = 20 / Math.max(canvas.width, canvas.height);
                    lines = []; openings = []; freeObjects = []; undoStack = []; redoStack = []; stopDrawing(); closeEditPanel(); draw2D(); update3D();
                }
            };
            reader.readAsDataURL(file);
        });

        // === 3D ENGINE ===
        const rightPanel = document.getElementById('right-panel');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setClearColor(0x27272a); rightPanel.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(20, 40, 20); scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x555555, 0x333333));
        
        const modelGroup = new THREE.Group(); scene.add(modelGroup);
        camera.position.set(0, 15, 20); 

        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix(); renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate();

        // ==============================================================
        // MODEL GENERATOR LENGKAP
        // ==============================================================
        function createStairsMesh(stepsCount, stairWidth, totalHeight) {
            const stairsGroup = new THREE.Group();
            const matStairs = new THREE.MeshLambertMaterial({ color: 0xd2b48c });
            const stepHeight = totalHeight / stepsCount;
            const stepDepth = 0.28;

            for (let i = 0; i < stepsCount; i++) {
                const geom = new THREE.BoxGeometry(stairWidth, stepHeight, stepDepth * (stepsCount - i));
                const mesh = new THREE.Mesh(geom, matStairs);
                mesh.position.set(0, (i * stepHeight) + (stepHeight / 2), (i * stepDepth) / 2);
                stairsGroup.add(mesh);
            }
            return stairsGroup;
        }

        function createFurnitureMesh(type) {
            const group = new THREE.Group();
            const matWood = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            const matFabric = new THREE.MeshLambertMaterial({ color: 0x34495e });
            const matWhite = new THREE.MeshLambertMaterial({ color: 0xecf0f1 });
            const matMetal = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
            const matGlass = new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.4 });

            if (type === 'bed') {
                const frame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 2.0), matWood); frame.position.y = 0.15; group.add(frame);
                const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.25, 1.9), matWhite); mattress.position.set(0, 0.4, 0); group.add(mattress);
                const pillow = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.4), matFabric); pillow.position.set(0, 0.55, -0.7); group.add(pillow);
            } else if (type === 'sofa') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.8), matFabric); base.position.y = 0.25; group.add(base);
                const back = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 0.2), matFabric); back.position.set(0, 0.6, -0.3); group.add(back);
            } else if (type === 'table') {
                const top = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.05, 0.8), matWood); top.position.y = 0.75; group.add(top);
                for(let x of [-0.5, 0.5]) { for(let z of [-0.3, 0.3]) {
                    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.72, 0.06), matWood); leg.position.set(x, 0.36, z); group.add(leg);
                }}
            } else if (type === 'chair') {
                const seat = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.04, 0.45), matWood); seat.position.y = 0.45; group.add(seat);
                const back = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.04), matWood); back.position.set(0, 0.68, -0.2); group.add(back);
            } else if (type === 'kitchen_set') {
                const counter = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.85, 0.6), matWood); counter.position.y = 0.425; group.add(counter);
                const sink = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.02, 0.4), matMetal); sink.position.set(-0.5, 0.86, 0); group.add(sink);
            } else if (type === 'stove') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.85, 0.6), matMetal); body.position.y = 0.425; group.add(body);
                const burner = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.04, 16), new THREE.MeshLambertMaterial({color:0x111111})); burner.position.set(0, 0.87, 0); group.add(burner);
            } else if (type === 'fridge') {
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.7), matMetal); body.position.y = 0.9; group.add(body);
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.4, 0.04), matWhite); handle.position.set(0.35, 1.1, 0.37); group.add(handle);
            } else if (type === 'toilet') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.6), matWhite); base.position.y = 0.2; group.add(base);
                const tank = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.5, 0.25), matWhite); tank.position.set(0, 0.65, -0.2); group.add(tank);
            } else if (type === 'shower') {
                const tray = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.1, 1.0), matWhite); tray.position.y = 0.05; group.add(tray);
                const glass = new THREE.Mesh(new THREE.BoxGeometry(0.02, 2.0, 1.0), matGlass); glass.position.set(0.49, 1.0, 0); group.add(glass);
                const head = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16), matMetal); head.position.set(0, 1.9, 0); group.add(head);
            } else if (type === 'bathtub') {
                const tub = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 0.75), matWhite); tub.position.y = 0.275; group.add(tub);
            }
            return group;
        }

        function update3D() {
            while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]); 
            if(lines.length === 0 && freeObjects.length === 0) return;

            const heightWall = parseFloat(inputWallH.value); 
            const thickWall = parseFloat(inputWallT.value);

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            lines.forEach(l => {
                minX = Math.min(minX, l.start.x, l.end.x); maxX = Math.max(maxX, l.start.x, l.end.x);
                minY = Math.min(minY, l.start.y, l.end.y); maxY = Math.max(maxY, l.start.y, l.end.y);
            });
            freeObjects.forEach(o => {
                minX = Math.min(minX, o.x); maxX = Math.max(maxX, o.x);
                minY = Math.min(minY, o.y); maxY = Math.max(maxY, o.y);
            });

            const center2DX = (minX === Infinity) ? 0 : (minX + maxX) / 2; 
            const center2DY = (minY === Infinity) ? 0 : (minY + maxY) / 2;
            
            const matWall = new THREE.MeshLambertMaterial({ color: 0xefefef });
            const matDoor = new THREE.MeshLambertMaterial({ color: 0x5c4033 }); 
            const matWindow = new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.5 }); 
            const matFrame = new THREE.MeshLambertMaterial({ color: 0x3f3f46 }); 
            const matFloor = new THREE.MeshLambertMaterial({ color: 0xd4d4d8, side: THREE.DoubleSide });

            // 1. LANTAI 3D (Solusi Bounding Box Pad agar tidak ada glitch segitiga)
            if (minX !== Infinity) {
                const floorPadding = 1.0; // 1 meter ekstra
                const floorW = (maxX - minX) * scale3D + floorPadding;
                const floorH = (maxY - minY) * scale3D + floorPadding;
                
                const floorGeom = new THREE.PlaneGeometry(floorW, floorH);
                const floorMesh = new THREE.Mesh(floorGeom, matFloor);
                floorMesh.rotation.x = -Math.PI / 2;
                floorMesh.position.set(0, 0.001, 0); // Posisikan persis di center scene
                modelGroup.add(floorMesh);
            }

            // 2. TEMBOK & BUKAAN
            lines.forEach((line, index) => {
                const dx = line.end.x - line.start.x; const dy = line.end.y - line.start.y;
                const length = Math.sqrt(dx*dx + dy*dy) * scale3D; const angle = Math.atan2(dy, dx);
                const midX = (line.start.x + line.end.x) / 2; const midY = (line.start.y + line.end.y) / 2;
                
                const posX = (midX - center2DX) * scale3D; const posZ = (midY - center2DY) * scale3D;

                const wallObj = new THREE.Group(); const wallShape = new THREE.Shape();
                wallShape.moveTo(0, 0); wallShape.lineTo(length, 0);
                wallShape.lineTo(length, heightWall); wallShape.lineTo(0, heightWall); wallShape.lineTo(0, 0);

                let ops = openings.filter(o => o.lineIndex === index).sort((a,b) => a.ratio - b.ratio);
                
                ops.forEach(op => {
                    const opCenter = length * op.ratio; const opStart = opCenter - op.width3D/2; const opEnd = opCenter + op.width3D/2;
                    const hole = new THREE.Path();
                    
                    if (op.type === 'door') {
                        hole.moveTo(opStart, op.elevation); hole.lineTo(opEnd, op.elevation); hole.lineTo(opEnd, op.elevation + op.height3D); hole.lineTo(opStart, op.elevation + op.height3D); hole.lineTo(opStart, op.elevation);
                        const leafGeom = new THREE.BoxGeometry(op.width3D, op.height3D, 0.04);
                        
                        if (op.flipHinge) {
                            leafGeom.translate(-op.width3D/2, op.height3D/2, 0); 
                            const doorMesh = new THREE.Mesh(leafGeom, matDoor);
                            doorMesh.position.set((opEnd) - length/2, op.elevation, 0); 
                            doorMesh.rotation.y = THREE.MathUtils.degToRad(-op.swing); 
                            wallObj.add(doorMesh);
                        } else {
                            leafGeom.translate(op.width3D/2, op.height3D/2, 0); 
                            const doorMesh = new THREE.Mesh(leafGeom, matDoor);
                            doorMesh.position.set((opStart) - length/2, op.elevation, 0); 
                            doorMesh.rotation.y = THREE.MathUtils.degToRad(op.swing); 
                            wallObj.add(doorMesh);
                        }

                    } else if (op.type === 'window') {
                        hole.moveTo(opStart, op.elevation); hole.lineTo(opEnd, op.elevation); hole.lineTo(opEnd, op.elevation + op.height3D); hole.lineTo(opStart, op.elevation + op.height3D); hole.lineTo(opStart, op.elevation);
                        const winMesh = new THREE.Mesh(new THREE.BoxGeometry(op.width3D, op.height3D, 0.02), matWindow);
                        winMesh.position.set(opCenter - length/2, op.elevation + op.height3D/2, 0); wallObj.add(winMesh);
                        const frame1 = new THREE.Mesh(new THREE.BoxGeometry(op.width3D, 0.05, thickWall + 0.02), matFrame);
                        frame1.position.set(opCenter - length/2, op.elevation + 0.025, 0);
                        const frame2 = frame1.clone(); frame2.position.set(opCenter - length/2, op.elevation + op.height3D - 0.025, 0);
                        wallObj.add(frame1); wallObj.add(frame2);
                    }
                    wallShape.holes.push(hole);
                });

                const extrudeSettings = { depth: thickWall, bevelEnabled: false };
                const wallMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(wallShape, extrudeSettings), matWall);
                wallMesh.position.set(-length/2, 0, -thickWall/2); wallObj.add(wallMesh);
                wallObj.position.set(posX, 0, posZ); wallObj.rotation.y = -angle; modelGroup.add(wallObj);
            });

            // 3. PILAR SUDUT TEMBOK
            const cornerGeom = new THREE.CylinderGeometry(thickWall/2, thickWall/2, heightWall, 16);
            let uniqueVertices = [];
            lines.forEach(l => {
                [l.start, l.end].forEach(pt => { if(!uniqueVertices.some(v => Math.hypot(v.x - pt.x, v.y - pt.y) < 1)) uniqueVertices.push(pt); });
            });
            uniqueVertices.forEach(v => {
                const posX = (v.x - center2DX) * scale3D; const posZ = (v.y - center2DY) * scale3D;
                const cornerMesh = new THREE.Mesh(cornerGeom, matWall);
                cornerMesh.position.set(posX, heightWall / 2, posZ); modelGroup.add(cornerMesh);
            });

            // 4. TANGGA & FULL MEBEL 3D
            freeObjects.forEach(obj => {
                const posX = (obj.x - center2DX) * scale3D;
                const posZ = (obj.y - center2DY) * scale3D;

                let meshGroup;
                if (obj.type === 'stairs') {
                    meshGroup = createStairsMesh(obj.steps || 14, obj.width3D || 1.0, heightWall);
                } else {
                    meshGroup = createFurnitureMesh(obj.type);
                }

                meshGroup.position.set(posX, 0, posZ);
                meshGroup.rotation.y = THREE.MathUtils.degToRad(obj.rotation || 0);
                const s = obj.scaleVal || 1.0;
                meshGroup.scale.set(s, s, s);

                modelGroup.add(meshGroup);
            });
        }

        // === WEBAR INTEGRATION LOGIC ===
        const arModal = document.getElementById('ar-modal');
        const arViewer = document.getElementById('arViewer');

        document.getElementById('arBtn').addEventListener('click', () => {
            if (lines.length === 0 && freeObjects.length === 0) {
                alert("Buat denah terlebih dahulu sebelum melihat dalam AR!");
                return;
            }

            new THREE.GLTFExporter().parse(modelGroup, (gltf) => {
                const blob = new Blob([gltf], { type: 'model/gltf-binary' });
                const modelUrl = URL.createObjectURL(blob);
                
                arViewer.src = modelUrl;
                arModal.style.display = 'flex';
            }, { binary: true });
        });

        document.getElementById('closeArBtn').addEventListener('click', () => {
            arModal.style.display = 'none';
        });

        document.getElementById('clearBtn').onclick = () => { saveState(); lines = []; openings = []; freeObjects = []; stopDrawing(); closeEditPanel(); draw2D(); update3D(); };
        document.getElementById('exportBtn').onclick = () => {
            new THREE.GLTFExporter().parse(modelGroup, (gltf) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([gltf], { type: 'application/octet-stream' })); link.download = 'denah_3d_architect.glb'; link.click();
            }, { binary: true });
        };
    </script>
