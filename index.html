<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan Tracer - Architect Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }
        
        #toolbar { background: #fff; padding: 10px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button, select { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: #eee; border-radius: 4px; font-size: 14px; transition: 0.2s; }
        button:hover { background: #ddd; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }
        button.active { background: #2196F3; color: white; border-color: #0b7dda; font-weight: bold; }
        
        .spacer { flex-grow: 1; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; }
        
        #left-panel { flex: 1; position: relative; background: #ccc; overflow: hidden; border-right: 2px solid #999; touch-action: none; cursor: crosshair; }
        #left-panel:active { cursor: crosshair; }
        
        #right-panel { flex: 1; position: relative; background: #222; }

        #workspace { transform-origin: 0 0; position: relative; }
        #floorplan-img { display: block; max-width: none; pointer-events: none; user-select: none; }
        #draw-canvas { position: absolute; top: 0; left: 0; }

        #instructions { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 8px; font-size: 12px; pointer-events: none; z-index: 20; line-height: 1.5; }

        /* Panel Editor Objek Melayang */
        #edit-panel {
            display: none; position: absolute; top: 70px; right: 20px; background: white; 
            padding: 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            z-index: 100; width: 220px; border: 1px solid #ccc;
        }
        #edit-panel label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; }
        #edit-panel input[type="range"] { width: 100%; margin-bottom: 15px; }

        @media (max-width: 800px) {
            #main-container { flex-direction: column; }
            #left-panel, #right-panel { flex: none; height: 50%; }
            #toolbar { justify-content: center; }
            #edit-panel { top: auto; bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="file" id="upload" accept="image/*" style="max-width: 180px;">
        <div style="border-left: 1px solid #ccc; height: 20px;"></div>
        
        <button id="modeSelect">👆 Pilih / Edit</button>
        <button id="modeWall" class="active">Gambar Tembok</button>
        <button id="modeDoor">🚪 Pintu</button>
        <button id="modeWindow">🪟 Jendela</button>
        
        <div style="border-left: 1px solid #ccc; height: 20px;"></div>
        <button id="undoBtn" disabled>Undo</button>
        <button id="redoBtn" disabled>Redo</button>
        <button id="clearBtn">Hapus Semua</button>
        
        <div class="spacer"></div>
        <button id="exportBtn" style="background: #4CAF50; color: white; border: none;">Export GLB</button>
    </div>

    <div id="edit-panel">
        <h4 style="margin: 0 0 15px 0; border-bottom: 1px solid #ccc; padding-bottom: 5px;">Edit Objek</h4>
        
        <label>Lebar: <span id="valWidth">0.9</span> m</label>
        <input type="range" id="editWidth" min="0.5" max="4.0" step="0.1" value="0.9">
        
        <div id="doorControls">
            <label>Bukaan / Swing: <span id="valSwing">45</span>°</label>
            <input type="range" id="editSwing" min="-180" max="180" step="5" value="45">
        </div>

        <button id="delObjBtn" style="background: #f44336; color: white; width: 100%; border: none; padding: 8px; border-radius: 4px;">🗑️ Hapus Objek</button>
    </div>

    <div id="main-container">
        <div id="left-panel">
            <div id="workspace">
                <img id="floorplan-img" src="">
                <canvas id="draw-canvas"></canvas>
            </div>
            <div id="instructions">
                <b>Panduan:</b><br>
                - <b>Pilih/Edit</b>: Klik pintu/jendela untuk ubah ukurannya<br>
                - <b>Zoom/Pan</b>: Scroll & Klik Kanan (Tahan)
            </div>
        </div>
        <div id="right-panel"></div>
    </div>

    <script>
        // === STATE & DATA ===
        let lines = []; 
        let openings = []; 
        let mode = 'wall'; 
        let scale3D = 0.02; // Global scale conversion (1 unit 3D = 1 Meter)
        
        let selectedOpening = null;
        let undoStack = [];
        let redoStack = [];

        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const imgElement = document.getElementById('floorplan-img');
        const leftPanel = document.getElementById('left-panel');
        
        // === UNDO / REDO LOGIC ===
        function saveState() {
            undoStack.push({
                lines: JSON.parse(JSON.stringify(lines)),
                openings: JSON.parse(JSON.stringify(openings))
            });
            redoStack = []; 
            document.getElementById('undoBtn').disabled = false;
            document.getElementById('redoBtn').disabled = true;
        }

        function restoreState(isUndo) {
            const current = { lines: JSON.parse(JSON.stringify(lines)), openings: JSON.parse(JSON.stringify(openings)) };
            if (isUndo) {
                redoStack.push(current);
                const prev = undoStack.pop();
                lines = prev.lines; openings = prev.openings;
            } else {
                undoStack.push(current);
                const next = redoStack.pop();
                lines = next.lines; openings = next.openings;
            }
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
            selectedOpening = null;
            closeEditPanel();
            draw2D(); update3D();
        }

        document.getElementById('undoBtn').onclick = () => restoreState(true);
        document.getElementById('redoBtn').onclick = () => restoreState(false);

        // === ZOOM & PAN 2D LOGIC ===
        let scale = 1;
        let panX = 0, panY = 0;
        let isPanning = false, startPanX = 0, startPanY = 0;

        function applyTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        leftPanel.addEventListener('wheel', (e) => {
            e.preventDefault();
            const newScale = Math.min(Math.max(0.05, scale + (e.deltaY * -0.001)), 10);
            const rect = workspace.parentElement.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            panX = mouseX - ((mouseX - panX) * (newScale / scale));
            panY = mouseY - ((mouseY - panY) * (newScale / scale));
            scale = newScale; applyTransform();
        });

        leftPanel.addEventListener('mousedown', (e) => {
            if (e.button === 2 || e.button === 1) { 
                isPanning = true; startPanX = e.clientX - panX; startPanY = e.clientY - panY;
                leftPanel.style.cursor = 'grabbing';
            }
        });
        window.addEventListener('mouseup', () => { isPanning = false; leftPanel.style.cursor = 'crosshair'; });
        window.addEventListener('mousemove', (e) => {
            if (isPanning) { panX = e.clientX - startPanX; panY = e.clientY - startPanY; applyTransform(); }
        });
        leftPanel.addEventListener('contextmenu', e => e.preventDefault());

        // === UI EDITOR & INTERAKSI KANVAS ===
        let isDrawing = false, currentLine = null;
        const SNAP_RADIUS = 20;

        document.getElementById('modeSelect').onclick = (e) => setMode('select', e.target);
        document.getElementById('modeWall').onclick = (e) => setMode('wall', e.target);
        document.getElementById('modeDoor').onclick = (e) => setMode('door', e.target);
        document.getElementById('modeWindow').onclick = (e) => setMode('window', e.target);

        function setMode(newMode, btn) {
            mode = newMode;
            document.querySelectorAll('#toolbar button.active').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isDrawing = false; currentLine = null;
            if (mode !== 'select') closeEditPanel();
            draw2D();
        }

        function getTrueCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            let { x, y } = getTrueCoords(e);
            
            if (mode === 'select') {
                // Deteksi klik objek (Pintu/Jendela)
                let clickedOp = null;
                let minDist = 20 / scale; // Toleransi klik
                
                openings.forEach(op => {
                    let l = lines[op.lineIndex];
                    if(l) {
                        const cx = l.start.x + (l.end.x - l.start.x) * op.ratio;
                        const cy = l.start.y + (l.end.y - l.start.y) * op.ratio;
                        if (Math.hypot(cx - x, cy - y) < minDist) {
                            clickedOp = op; minDist = Math.hypot(cx - x, cy - y);
                        }
                    }
                });

                if (clickedOp) {
                    selectedOpening = clickedOp;
                    openEditPanel(selectedOpening);
                } else {
                    selectedOpening = null;
                    closeEditPanel();
                }
                draw2D();
            } 
            else if (mode === 'wall') {
                let snap = getSnapped(x, y);
                if (!isDrawing) {
                    saveState(); 
                    isDrawing = true; currentLine = { start: snap, end: snap };
                } else {
                    currentLine.end = snap; lines.push({...currentLine});
                    isDrawing = false; currentLine = null; update3D();
                }
                draw2D();
            } 
            else if (mode === 'door' || mode === 'window') {
                let nearest = findNearestLine(x, y);
                if (nearest) {
                    saveState(); 
                    // Standar Kaidah Arsitektur 3D (dalam Meter)
                    openings.push({
                        id: Date.now(),
                        type: mode,
                        lineIndex: nearest.index,
                        ratio: nearest.ratio,
                        width3D: mode === 'door' ? 0.9 : 1.2, // Lebar Jendela/Pintu
                        height3D: mode === 'door' ? 2.1 : 1.2, // Tinggi
                        elevation: mode === 'door' ? 0 : 0.9, // Ketinggian dari lantai
                        swing: 85 // Sudut bukaan pintu (Derajat)
                    });
                    update3D(); draw2D();
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && mode === 'wall') {
                let { x, y } = getTrueCoords(e);
                currentLine.end = getSnapped(x, y); draw2D();
            }
        });

        // Fitur Snap dan Pencarian Garis Terdekat (Sama seperti sebelumnya)
        function getSnapped(x, y) {
            for (let l of lines) {
                if (Math.hypot(l.start.x - x, l.start.y - y) < SNAP_RADIUS / scale) return { x: l.start.x, y: l.start.y };
                if (Math.hypot(l.end.x - x, l.end.y - y) < SNAP_RADIUS / scale) return { x: l.end.x, y: l.end.y };
            }
            return { x, y };
        }

        function findNearestLine(px, py) {
            let minDist = 30 / scale; let result = null;
            lines.forEach((l, index) => {
                const l2 = Math.pow(l.end.x - l.start.x, 2) + Math.pow(l.end.y - l.start.y, 2);
                if (l2 === 0) return;
                let t = Math.max(0, Math.min(1, ((px - l.start.x) * (l.end.x - l.start.x) + (py - l.start.y) * (l.end.y - l.start.y)) / l2));
                const projX = l.start.x + t * (l.end.x - l.start.x); const projY = l.start.y + t * (l.end.y - l.start.y);
                const dist = Math.hypot(px - projX, py - projY);
                if (dist < minDist) { minDist = dist; result = { index, ratio: t }; }
            });
            return result;
        }

        // === PANEL EDITOR MELAYANG ===
        const editPanel = document.getElementById('edit-panel');
        const editWidth = document.getElementById('editWidth');
        const editSwing = document.getElementById('editSwing');
        const valWidth = document.getElementById('valWidth');
        const valSwing = document.getElementById('valSwing');

        function openEditPanel(op) {
            editPanel.style.display = 'block';
            editWidth.value = op.width3D; valWidth.innerText = op.width3D;
            
            if (op.type === 'door') {
                document.getElementById('doorControls').style.display = 'block';
                editSwing.value = op.swing; valSwing.innerText = op.swing;
            } else {
                document.getElementById('doorControls').style.display = 'none';
            }
        }

        function closeEditPanel() {
            editPanel.style.display = 'none';
            selectedOpening = null;
        }

        // Event Listener Slider (Real-time update)
        editWidth.addEventListener('input', (e) => {
            if (selectedOpening) {
                selectedOpening.width3D = parseFloat(e.target.value);
                valWidth.innerText = selectedOpening.width3D;
                update3D(); draw2D();
            }
        });
        
        editWidth.addEventListener('change', () => saveState()); // Save saat di-drop

        editSwing.addEventListener('input', (e) => {
            if (selectedOpening) {
                selectedOpening.swing = parseFloat(e.target.value);
                valSwing.innerText = selectedOpening.swing;
                update3D(); draw2D();
            }
        });

        editSwing.addEventListener('change', () => saveState());

        document.getElementById('delObjBtn').addEventListener('click', () => {
            if (selectedOpening) {
                saveState();
                openings = openings.filter(o => o.id !== selectedOpening.id);
                closeEditPanel(); update3D(); draw2D();
            }
        });

        // === 2D RENDER (SIMBOL ARSITEKTUR) ===
        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineWidth = Math.max(4, canvas.width * 0.003); 
            
            // Gambar Garis Tembok
            ctx.strokeStyle = '#222';
            lines.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.start.x, l.start.y); ctx.lineTo(l.end.x, l.end.y); ctx.stroke();
            });

            if (currentLine) {
                ctx.strokeStyle = '#f44336';
                ctx.beginPath(); ctx.moveTo(currentLine.start.x, currentLine.start.y); ctx.lineTo(currentLine.end.x, currentLine.end.y); ctx.stroke();
            }

            // Gambar Simbol Pintu & Jendela
            openings.forEach(op => {
                let l = lines[op.lineIndex];
                if(!l) return;
                const angle = Math.atan2(l.end.y - l.start.y, l.end.x - l.start.x);
                const cx = l.start.x + (l.end.x - l.start.x) * op.ratio;
                const cy = l.start.y + (l.end.y - l.start.y) * op.ratio;
                
                // Konversi ukuran 3D (Meter) kembali ke ukuran pixel 2D
                const opWidth2D = op.width3D / scale3D; 

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);

                // Highlight jika sedang diedit
                if (op === selectedOpening) {
                    ctx.shadowColor = '#2196F3';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = 'rgba(33, 150, 243, 0.3)';
                    ctx.fillRect(-opWidth2D/2, -ctx.lineWidth, opWidth2D, ctx.lineWidth*2);
                }

                if (op.type === 'door') {
                    // Hapus visual tembok di area bukaan
                    ctx.clearRect(-opWidth2D/2, -ctx.lineWidth, opWidth2D, ctx.lineWidth * 2);
                    
                    // Arah Bukaan Pintu (berdasarkan nilai slider)
                    let swingDir = op.swing >= 0 ? -1 : 1;
                    
                    ctx.beginPath(); // Daun pintu
                    ctx.moveTo(-opWidth2D/2, 0);
                    ctx.lineTo(-opWidth2D/2, opWidth2D * swingDir); 
                    ctx.lineWidth = Math.max(2, canvas.width * 0.002);
                    ctx.strokeStyle = '#8B4513';
                    ctx.stroke();

                    ctx.beginPath(); // Lengkungan swing (Arc)
                    ctx.arc(-opWidth2D/2, 0, opWidth2D, swingDir < 0 ? -Math.PI/2 : 0, swingDir < 0 ? 0 : Math.PI/2);
                    ctx.strokeStyle = 'rgba(139, 69, 19, 0.4)';
                    ctx.stroke();
                } else {
                    // Jendela (Kotak biru)
                    ctx.fillStyle = 'rgba(135, 206, 235, 0.8)';
                    const th = ctx.lineWidth * 1.5;
                    ctx.fillRect(-opWidth2D/2, -th/2, opWidth2D, th);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(-opWidth2D/2, -th/2, opWidth2D, th);
                }
                ctx.restore();
            });
        }

        // === AUTO FIT IMAGE ===
        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imgElement.src = event.target.result;
                imgElement.onload = () => {
                    canvas.width = imgElement.width; canvas.height = imgElement.height;
                    
                    const panelWidth = leftPanel.clientWidth; const panelHeight = leftPanel.clientHeight;
                    scale = Math.min(panelWidth / imgElement.width, panelHeight / imgElement.height) * 0.9;
                    panX = (panelWidth - (imgElement.width * scale)) / 2; panY = (panelHeight - (imgElement.height * scale)) / 2;
                    applyTransform();
                    
                    // Setup skala 3D: Anggap lebar gambar terbesar merepresentasikan rumah 20 meter.
                    scale3D = 20 / Math.max(canvas.width, canvas.height);

                    lines = []; openings = []; undoStack = []; redoStack = []; closeEditPanel();
                    draw2D(); update3D();
                }
            };
            reader.readAsDataURL(file);
        });

        // === 3D ENGINE (Extrude + Origin Centering) ===
        const rightPanel = document.getElementById('right-panel');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setClearColor(0x2d2d2d);
        rightPanel.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x555555, 0x333333));
        
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);
        camera.position.set(0, 15, 20); 

        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update(); renderer.render(scene, camera);
        }
        animate();

        function update3D() {
            while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]); 

            if(lines.length === 0) return;

            // 1. Kalkulasi Bounding Box untuk memusatkan obyek di 0,0,0
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            lines.forEach(l => {
                minX = Math.min(minX, l.start.x, l.end.x); maxX = Math.max(maxX, l.start.x, l.end.x);
                minY = Math.min(minY, l.start.y, l.end.y); maxY = Math.max(maxY, l.start.y, l.end.y);
            });
            
            // Titik tengah gambar sebenarnya
            const center2DX = (minX + maxX) / 2;
            const center2DY = (minY + maxY) / 2;

            const heightWall = 3.0; // Tinggi plafon standar 3m
            const thickWall = 0.15; // Ketebalan bata 15cm

            const matWall = new THREE.MeshLambertMaterial({ color: 0xf5f5f5 });
            const matDoor = new THREE.MeshLambertMaterial({ color: 0x5c4033 }); // Kayu Jati
            const matWindow = new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.5 }); 
            const matFrame = new THREE.MeshLambertMaterial({ color: 0x333333 }); 

            lines.forEach((line, index) => {
                const dx = line.end.x - line.start.x;
                const dy = line.end.y - line.start.y;
                const length = Math.sqrt(dx*dx + dy*dy) * scale3D;
                const angle = Math.atan2(dy, dx);
                
                const midX = (line.start.x + line.end.x) / 2;
                const midY = (line.start.y + line.end.y) / 2;
                
                // Kurangi kordinat saat ini dengan titik tengah agar 3D ter-align ke (0,0,0)
                const posX = (midX - center2DX) * scale3D;
                const posZ = (midY - center2DY) * scale3D;

                const wallObj = new THREE.Group();
                const wallShape = new THREE.Shape();
                wallShape.moveTo(0, 0); wallShape.lineTo(length, 0);
                wallShape.lineTo(length, heightWall); wallShape.lineTo(0, heightWall); wallShape.lineTo(0, 0);

                let ops = openings.filter(o => o.lineIndex === index).sort((a,b) => a.ratio - b.ratio);
                
                ops.forEach(op => {
                    const opCenter = length * op.ratio; 
                    const opStart = opCenter - op.width3D/2;
                    const opEnd = opCenter + op.width3D/2;
                    const hole = new THREE.Path();
                    
                    if (op.type === 'door') {
                        // Bolongan Pintu
                        hole.moveTo(opStart, op.elevation);
                        hole.lineTo(opEnd, op.elevation);
                        hole.lineTo(opEnd, op.elevation + op.height3D);
                        hole.lineTo(opStart, op.elevation + op.height3D);
                        hole.lineTo(opStart, op.elevation);
                        
                        // Objek 3D Daun Pintu (Tebal 4cm)
                        const leafGeom = new THREE.BoxGeometry(op.width3D, op.height3D, 0.04);
                        // Pindahkan pivot ke engsel (ujung kiri)
                        leafGeom.translate(op.width3D/2, op.height3D/2, 0); 
                        
                        const doorMesh = new THREE.Mesh(leafGeom, matDoor);
                        // Posisikan engsel di ujung bolongan
                        doorMesh.position.set((opStart) - length/2, op.elevation, 0); 
                        doorMesh.rotation.y = THREE.MathUtils.degToRad(op.swing); 
                        wallObj.add(doorMesh);

                    } else if (op.type === 'window') {
                        // Bolongan Jendela
                        hole.moveTo(opStart, op.elevation);
                        hole.lineTo(opEnd, op.elevation);
                        hole.lineTo(opEnd, op.elevation + op.height3D);
                        hole.lineTo(opStart, op.elevation + op.height3D);
                        hole.lineTo(opStart, op.elevation);
                        
                        // Objek 3D Kaca Jendela
                        const winMesh = new THREE.Mesh(new THREE.BoxGeometry(op.width3D, op.height3D, 0.02), matWindow);
                        winMesh.position.set(opCenter - length/2, op.elevation + op.height3D/2, 0);
                        wallObj.add(winMesh);

                        // Kusen Bawah & Atas
                        const frame1 = new THREE.Mesh(new THREE.BoxGeometry(op.width3D, 0.05, thickWall + 0.02), matFrame);
                        frame1.position.set(opCenter - length/2, op.elevation + 0.025, 0);
                        const frame2 = frame1.clone();
                        frame2.position.set(opCenter - length/2, op.elevation + op.height3D - 0.025, 0);
                        wallObj.add(frame1); wallObj.add(frame2);
                    }
                    wallShape.holes.push(hole);
                });

                const extrudeSettings = { depth: thickWall, bevelEnabled: false };
                const geometry = new THREE.ExtrudeGeometry(wallShape, extrudeSettings);
                const wallMesh = new THREE.Mesh(geometry, matWall);
                
                wallMesh.position.set(-length/2, 0, -thickWall/2);
                wallObj.add(wallMesh);
                
                wallObj.position.set(posX, 0, posZ);
                wallObj.rotation.y = -angle;
                
                modelGroup.add(wallObj);
            });
        }

        document.getElementById('clearBtn').onclick = () => { 
            saveState(); lines = []; openings = []; closeEditPanel(); draw2D(); update3D(); 
        };
        
        document.getElementById('exportBtn').onclick = () => {
            new THREE.GLTFExporter().parse(modelGroup, (gltf) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([gltf], { type: 'application/octet-stream' }));
                link.download = 'denah_3d_architect.glb';
                link.click();
            }, { binary: true });
        };
    </script>
</body>
</html>
