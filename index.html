<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan Tracer</title>
    <!-- Load Three.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load OrbitControls untuk navigasi kamera 3D -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #toolbar {
            background: #fff;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            align-items: center;
        }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #left-panel {
            flex: 1;
            position: relative;
            background-color: #e0e0e0;
            overflow: auto;
            border-right: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #right-panel {
            flex: 1;
            position: relative;
            background-color: #222;
        }

        /* Container untuk menggabungkan gambar dan canvas */
        #workspace {
            position: relative;
            display: none; /* Sembunyi sampai gambar diupload */
            transform-origin: top left;
        }

        #floorplan-img {
            display: block;
            max-width: 100%;
            user-select: none;
            pointer-events: none; /* Biar klik tembus ke canvas */
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 20;
            line-height: 1.5;
        }

        #instructions h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        #instructions ol {
            margin: 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <label for="upload" style="font-weight: bold; margin-right: 10px;">Pilih Denah:</label>
        <input type="file" id="upload" accept="image/png, image/jpeg, image/jpg">
        <button id="clearBtn" style="margin-left: auto; padding: 5px 15px; cursor: pointer;">Hapus Semua Garis</button>
    </div>

    <div id="main-container">
        <!-- 2D View -->
        <div id="left-panel">
            <div id="workspace">
                <img id="floorplan-img" src="" alt="Floor plan">
                <canvas id="draw-canvas"></canvas>
            </div>
            
            <div id="instructions">
                <h4>Cara Kerja:</h4>
                <ol>
                    <li>Upload file (misal: denah.png)</li>
                    <li>Klik kiri untuk mulai garis tembok</li>
                    <li>Klik kiri lagi untuk mengakhiri garis</li>
                    <li>View 3D di kanan akan otomatis update</li>
                    <li>Gunakan mouse kiri di area 3D untuk putar kamera</li>
                </ol>
            </div>
        </div>

        <!-- 3D View -->
        <div id="right-panel">
            <!-- Canvas Three.js akan digenerate di sini -->
        </div>
    </div>

    <script>
        // === KONFIGURASI 2D CANVAS ===
        const workspace = document.getElementById('workspace');
        const imgElement = document.getElementById('floorplan-img');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const uploadInput = document.getElementById('upload');
        const clearBtn = document.getElementById('clearBtn');

        let lines = [];
        let isDrawing = false;
        let currentLine = null;
        let canvasScale = 1;

        // Handle Upload Gambar
        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                imgElement.src = event.target.result;
                imgElement.onload = function() {
                    workspace.style.display = 'block';
                    
                    // Sesuaikan ukuran canvas dengan gambar
                    canvas.width = imgElement.width;
                    canvas.height = imgElement.height;
                    
                    lines = []; // Reset garis saat upload baru
                    draw2D();
                    update3D();
                }
            };
            reader.readAsDataURL(file);
        });

        clearBtn.addEventListener('click', () => {
            lines = [];
            isDrawing = false;
            currentLine = null;
            draw2D();
            update3D();
        });

        // Event Mouse untuk Menggambar di 2D Canvas
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            // Kalkulasi kordinat mouse disesuaikan dengan scale/zoom browser
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            if (!isDrawing) {
                // Mulai garis baru
                isDrawing = true;
                currentLine = { start: { x, y }, end: { x, y } };
            } else {
                // Selesaikan garis
                currentLine.end = { x, y };
                lines.push({...currentLine}); // Simpan
                isDrawing = false;
                currentLine = null;
                update3D(); // Update view 3D setiap selesai 1 garis
            }
            draw2D();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && currentLine) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                currentLine.end = { 
                    x: (e.clientX - rect.left) * scaleX, 
                    y: (e.clientY - rect.top) * scaleY 
                };
                draw2D();
            }
        });

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Setting style garis
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            
            // Gambar semua garis yang sudah fix
            ctx.strokeStyle = 'red';
            lines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.start.x, line.start.y);
                ctx.lineTo(line.end.x, line.end.y);
                ctx.stroke();
            });

            // Gambar garis yang sedang di-drag
            if (currentLine) {
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.5)'; // Transparan
                ctx.beginPath();
                ctx.moveTo(currentLine.start.x, currentLine.start.y);
                ctx.lineTo(currentLine.end.x, currentLine.end.y);
                ctx.stroke();
            }
        }

        // === KONFIGURASI 3D THREE.JS ===
        const rightPanel = document.getElementById('right-panel');
        
        // Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setClearColor(0x2d2d2d);
        rightPanel.appendChild(renderer.domElement);

        // OrbitControls (Biar bisa di-rotate, pan, zoom)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Grid (Lantai)
        const gridHelper = new THREE.GridHelper(50, 50, 0x555555, 0x444444);
        scene.add(gridHelper);

        // Group untuk menampung semua tembok 3D
        const wallsGroup = new THREE.Group();
        scene.add(wallsGroup);

        // Posisi awal kamera
        camera.position.set(0, 15, 15);
        controls.update();

        // Fungsi sinkronisasi ukuran panel jika window di-resize
        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        // Loop Render 3D
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Fungsi merubah Garis 2D ke Tembok 3D
        function update3D() {
            // Hapus semua tembok sebelumnya
            while(wallsGroup.children.length > 0){ 
                wallsGroup.remove(wallsGroup.children[0]); 
            }

            // Skala konversi pixel (2D) ke meter (3D Unit)
            const scale3D = 0.02;  
            const wallHeight = 2.5; // Tinggi tembok
            const wallThickness = 0.2; // Ketebalan tembok
            
            // Material tembok warna putih/abu terang
            const material = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });

            lines.forEach(line => {
                const dx = line.end.x - line.start.x;
                const dy = line.end.y - line.start.y;
                
                // Jarak/Panjang garis di 2D, lalu diskalakan ke 3D
                const length = Math.sqrt(dx*dx + dy*dy) * scale3D;
                // Sudut rotasi garis
                const angle = Math.atan2(dy, dx);
                
                // Titik tengah garis (untuk penempatan posisi obyek di ThreeJS)
                const midX = (line.start.x + line.end.x) / 2;
                const midY = (line.start.y + line.end.y) / 2;

                // Center koordinat: Geser kordinat agar titik tengah gambar ada di (0,0) pada 3D
                const posX = (midX - canvas.width / 2) * scale3D;
                const posZ = (midY - canvas.height / 2) * scale3D;

                // Buat Box 3D
                const geometry = new THREE.BoxGeometry(length, wallHeight, wallThickness);
                const wallMesh = new THREE.Mesh(geometry, material);

                // Set posisi dan rotasi
                wallMesh.position.set(posX, wallHeight / 2, posZ);
                // Di 3D Three.js, rotasi yang sejalan dengan Atan2 adalah di sumbu Y (negatif)
                wallMesh.rotation.y = -angle;

                // Tambahkan edge (garis luar tepi) agar batas tembok lebih terlihat
                const edges = new THREE.EdgesGeometry(geometry);
                const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 2 });
                const edgeMesh = new THREE.LineSegments(edges, edgeMaterial);
                wallMesh.add(edgeMesh); // attach garis tepi ke tembok

                wallsGroup.add(wallMesh);
            });
        }
    </script>
</body>
</html>
