<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan Tracer - Pro</title>
    <!-- Load Three.js dari CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Load GLTF Exporter -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #toolbar {
            background: #fff;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #eee;
            border-radius: 4px;
        }

        button:hover { background: #ddd; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }

        .spacer { flex-grow: 1; }

        #main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #left-panel {
            flex: 1;
            position: relative;
            background-color: #e0e0e0;
            overflow: auto;
            border-right: 2px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #right-panel {
            flex: 1;
            position: relative;
            background-color: #222;
        }

        #workspace {
            position: relative;
            display: none; 
            transform-origin: top left;
        }

        #floorplan-img {
            display: block;
            max-width: 100%;
            user-select: none;
            pointer-events: none;
        }

        #draw-canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: crosshair;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            z-index: 20;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <label for="upload" style="font-weight: bold;">Denah:</label>
        <input type="file" id="upload" accept="image/png, image/jpeg, image/jpg">
        
        <div style="border-left: 1px solid #ccc; height: 20px; margin: 0 5px;"></div>
        
        <button id="undoBtn" disabled>Undo</button>
        <button id="redoBtn" disabled>Redo</button>
        <button id="clearBtn">Hapus Semua</button>
        
        <div class="spacer"></div>
        <button id="exportBtn" style="background: #4CAF50; color: white; border: none;">Export to GLB</button>
    </div>

    <div id="main-container">
        <!-- 2D View -->
        <div id="left-panel">
            <div id="workspace">
                <img id="floorplan-img" src="" alt="Floor plan">
                <canvas id="draw-canvas"></canvas>
            </div>
            
            <div id="instructions">
                <b>Tips Menggambar:</b><br>
                - <b>Klik Kiri</b>: Mulai/akhiri garis<br>
                - <b>Tahan SHIFT</b>: Snap ke Axis (Lurus 90°)<br>
                - <b>Dekatkan ke ujung</b>: Otomatis Snap to Endpoint
            </div>
        </div>

        <!-- 3D View -->
        <div id="right-panel"></div>
    </div>

    <script>
        // === STATE MANAGEMENT (UNDO/REDO) ===
        let lines = [];
        let undoStack = [];
        let redoStack = [];

        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');

        function saveState() {
            undoStack.push(JSON.parse(JSON.stringify(lines)));
            redoStack = []; 
            updateButtons();
        }

        function updateButtons() {
            undoBtn.disabled = undoStack.length === 0;
            redoBtn.disabled = redoStack.length === 0;
        }

        undoBtn.addEventListener('click', () => {
            if (undoStack.length > 0) {
                redoStack.push(JSON.parse(JSON.stringify(lines)));
                lines = undoStack.pop();
                updateButtons();
                draw2D();
                update3D();
            }
        });

        redoBtn.addEventListener('click', () => {
            if (redoStack.length > 0) {
                undoStack.push(JSON.parse(JSON.stringify(lines)));
                lines = redoStack.pop();
                updateButtons();
                draw2D();
                update3D();
            }
        });

        // === KONFIGURASI 2D CANVAS ===
        const workspace = document.getElementById('workspace');
        const imgElement = document.getElementById('floorplan-img');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        
        let isDrawing = false;
        let currentLine = null;
        const SNAP_RADIUS = 15; // Jarak pixel untuk snap

        // Handle Upload
        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                imgElement.src = event.target.result;
                imgElement.onload = function() {
                    workspace.style.display = 'block';
                    canvas.width = imgElement.width;
                    canvas.height = imgElement.height;
                    lines = []; undoStack = []; redoStack = []; updateButtons();
                    draw2D(); update3D();
                }
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            saveState();
            lines = [];
            isDrawing = false;
            currentLine = null;
            draw2D(); update3D();
        });

        // Fungsi Snapping Logic
        function getSnappedCoord(mouseX, mouseY, e) {
            let snapX = mouseX;
            let snapY = mouseY;
            let snapped = false;

            // 1. Snap to Endpoint (Cek titik-titik garis yang sudah ada)
            for (let line of lines) {
                if (Math.hypot(line.start.x - mouseX, line.start.y - mouseY) < SNAP_RADIUS) {
                    snapX = line.start.x; snapY = line.start.y; snapped = true; break;
                }
                if (Math.hypot(line.end.x - mouseX, line.end.y - mouseY) < SNAP_RADIUS) {
                    snapX = line.end.x; snapY = line.end.y; snapped = true; break;
                }
            }

            // 2. Snap to Axis (Lurus) jika tombol SHIFT ditahan & sedang menggambar
            if (e.shiftKey && isDrawing && currentLine && !snapped) {
                const dx = Math.abs(mouseX - currentLine.start.x);
                const dy = Math.abs(mouseY - currentLine.start.y);
                if (dx > dy) {
                    snapY = currentLine.start.y; // Kunci ke Horizontal
                } else {
                    snapX = currentLine.start.x; // Kunci ke Vertikal
                }
            }

            return { x: snapX, y: snapY, snapped };
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const rawX = (e.clientX - rect.left) * scaleX;
            const rawY = (e.clientY - rect.top) * scaleY;

            const { x, y } = getSnappedCoord(rawX, rawY, e);

            if (!isDrawing) {
                saveState(); // Simpan state sebelum menambah garis baru
                isDrawing = true;
                currentLine = { start: { x, y }, end: { x, y } };
            } else {
                currentLine.end = { x, y };
                lines.push({...currentLine});
                isDrawing = false;
                currentLine = null;
                update3D();
            }
            draw2D();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && currentLine) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const rawX = (e.clientX - rect.left) * scaleX;
                const rawY = (e.clientY - rect.top) * scaleY;

                const coord = getSnappedCoord(rawX, rawY, e);
                currentLine.end = { x: coord.x, y: coord.y };
                currentLine.isSnapped = coord.snapped; // untuk penanda visual
                
                draw2D();
            }
        });

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            
            // Gambar garis fix
            ctx.strokeStyle = '#f44336';
            lines.forEach(line => {
                ctx.beginPath();
                ctx.moveTo(line.start.x, line.start.y);
                ctx.lineTo(line.end.x, line.end.y);
                ctx.stroke();
            });

            // Gambar garis yang sedang di-drag
            if (currentLine) {
                ctx.strokeStyle = 'rgba(244, 67, 54, 0.5)';
                ctx.beginPath();
                ctx.moveTo(currentLine.start.x, currentLine.start.y);
                ctx.lineTo(currentLine.end.x, currentLine.end.y);
                ctx.stroke();

                // Indikator visual saat snap berhasil
                if (currentLine.isSnapped) {
                    ctx.beginPath();
                    ctx.arc(currentLine.end.x, currentLine.end.y, 6, 0, 2 * Math.PI);
                    ctx.fillStyle = '#4CAF50';
                    ctx.fill();
                }
            }
        }

        // === KONFIGURASI 3D THREE.JS ===
        const rightPanel = document.getElementById('right-panel');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setClearColor(0x2d2d2d);
        rightPanel.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const gridHelper = new THREE.GridHelper(50, 50, 0x555555, 0x444444);
        scene.add(gridHelper);

        const wallsGroup = new THREE.Group();
        scene.add(wallsGroup);

        camera.position.set(0, 15, 15);

        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function update3D() {
            while(wallsGroup.children.length > 0){ 
                wallsGroup.remove(wallsGroup.children[0]); 
            }

            const scale3D = 0.02;  
            const wallHeight = 2.5; 
            const wallThickness = 0.2; 
            const material = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });

            lines.forEach(line => {
                const dx = line.end.x - line.start.x;
                const dy = line.end.y - line.start.y;
                const length = Math.sqrt(dx*dx + dy*dy) * scale3D;
                const angle = Math.atan2(dy, dx);
                
                const midX = (line.start.x + line.end.x) / 2;
                const midY = (line.start.y + line.end.y) / 2;
                const posX = (midX - canvas.width / 2) * scale3D;
                const posZ = (midY - canvas.height / 2) * scale3D;

                const geometry = new THREE.BoxGeometry(length, wallHeight, wallThickness);
                const wallMesh = new THREE.Mesh(geometry, material);
                wallMesh.position.set(posX, wallHeight / 2, posZ);
                wallMesh.rotation.y = -angle;

                const edges = new THREE.EdgesGeometry(geometry);
                const edgeMaterial = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 2 });
                const edgeMesh = new THREE.LineSegments(edges, edgeMaterial);
                wallMesh.add(edgeMesh); 

                wallsGroup.add(wallMesh);
            });
        }

        // === FITUR EXPORT GLB ===
        document.getElementById('exportBtn').addEventListener('click', () => {
            if (wallsGroup.children.length === 0) {
                alert("Belum ada tembok untuk diexport!");
                return;
            }

            const exporter = new THREE.GLTFExporter();
            // Parse Group tembok (wallsGroup)
            exporter.parse(wallsGroup, function (gltf) {
                const blob = new Blob([gltf], { type: 'application/octet-stream' });
                const link = document.createElement('a');
                link.style.display = 'none';
                link.href = URL.createObjectURL(blob);
                link.download = 'denah_3d.glb'; // Nama file
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, { binary: true }); // binary: true untuk GLB (file tunggal), false untuk GLTF
        });
    </script>
</body>
</html>
