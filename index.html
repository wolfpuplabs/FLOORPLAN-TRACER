<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Floor Plan Tracer - ExtrudeGeometry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }
        
        #toolbar { background: #fff; padding: 10px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button, select { padding: 6px 12px; cursor: pointer; border: 1px solid #ccc; background: #eee; border-radius: 4px; font-size: 14px; }
        button:hover, select:hover { background: #ddd; }
        button.active { background: #2196F3; color: white; border-color: #0b7dda; }
        
        .spacer { flex-grow: 1; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; }
        
        #left-panel { flex: 1; position: relative; background: #ccc; overflow: hidden; border-right: 2px solid #999; touch-action: none; cursor: grab; }
        #left-panel:active { cursor: grabbing; }
        
        #right-panel { flex: 1; position: relative; background: #222; }

        #workspace { transform-origin: 0 0; }
        #floorplan-img { display: block; max-width: none; pointer-events: none; user-select: none; }
        #draw-canvas { position: absolute; top: 0; left: 0; }

        #instructions { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.7); color: white; padding: 10px 15px; border-radius: 8px; font-size: 12px; pointer-events: none; z-index: 20; line-height: 1.5; }

        /* Tablet / Mobile Responsive */
        @media (max-width: 800px) {
            #main-container { flex-direction: column; }
            #left-panel, #right-panel { flex: none; height: 50%; }
            #toolbar { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <input type="file" id="upload" accept="image/*" style="max-width: 200px;">
        <div style="border-left: 1px solid #ccc; height: 20px;"></div>
        
        <button id="modeWall" class="active">Gambar Tembok</button>
        <button id="modeDoor">🚪 Pintu</button>
        <button id="modeWindow">🪟 Jendela</button>
        
        <div style="border-left: 1px solid #ccc; height: 20px;"></div>
        <button id="clearBtn">Hapus Semua</button>
        
        <div class="spacer"></div>
        <button id="exportBtn" style="background: #4CAF50; color: white; border: none;">Export GLB</button>
    </div>

    <div id="main-container">
        <div id="left-panel">
            <div id="workspace">
                <img id="floorplan-img" src="">
                <canvas id="draw-canvas"></canvas>
            </div>
            <div id="instructions">
                <b>Kontrol 2D:</b><br>
                - <b>Scroll / Pinch</b>: Zoom In/Out<br>
                - <b>Klik Kanan / 2 Jari</b>: Geser (Pan)<br>
                - <b>Klik Tembok (Mode Pintu/Jendela)</b>: Taruh objek
            </div>
        </div>
        <div id="right-panel"></div>
    </div>

    <script>
        // === STATE & DATA ===
        let lines = []; 
        let openings = []; // Menampung Pintu & Jendela
        let mode = 'wall'; // 'wall', 'door', 'window'
        
        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const imgElement = document.getElementById('floorplan-img');

        // === ZOOM & PAN 2D LOGIC ===
        let scale = 1;
        let panX = 0, panY = 0;
        let isPanning = false, startPanX = 0, startPanY = 0;

        function applyTransform() {
            workspace.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        document.getElementById('left-panel').addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomAmount = e.deltaY * -0.001;
            const newScale = Math.min(Math.max(0.1, scale + zoomAmount), 5);
            
            const rect = workspace.parentElement.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            panX = mouseX - ((mouseX - panX) * (newScale / scale));
            panY = mouseY - ((mouseY - panY) * (newScale / scale));
            scale = newScale;
            applyTransform();
        });

        document.getElementById('left-panel').addEventListener('mousedown', (e) => {
            if (e.button === 2 || e.button === 1) { 
                isPanning = true;
                startPanX = e.clientX - panX;
                startPanY = e.clientY - panY;
            }
        });
        window.addEventListener('mouseup', () => isPanning = false);
        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startPanX;
                panY = e.clientY - startPanY;
                applyTransform();
            }
        });
        document.getElementById('left-panel').addEventListener('contextmenu', e => e.preventDefault());

        // === 2D DRAWING & EDITOR ===
        let isDrawing = false;
        let currentLine = null;
        const SNAP_RADIUS = 20;

        document.getElementById('modeWall').onclick = (e) => setMode('wall', e.target);
        document.getElementById('modeDoor').onclick = (e) => setMode('door', e.target);
        document.getElementById('modeWindow').onclick = (e) => setMode('window', e.target);

        function setMode(newMode, btn) {
            mode = newMode;
            document.querySelectorAll('#toolbar button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isDrawing = false; currentLine = null; draw2D();
        }

        function getTrueCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - panX) / scale,
                y: (e.clientY - rect.top - panY) / scale
            };
        }

        function getSnapped(x, y) {
            for (let l of lines) {
                if (Math.hypot(l.start.x - x, l.start.y - y) < SNAP_RADIUS / scale) return { x: l.start.x, y: l.start.y };
                if (Math.hypot(l.end.x - x, l.end.y - y) < SNAP_RADIUS / scale) return { x: l.end.x, y: l.end.y };
            }
            return { x, y };
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; 
            let { x, y } = getTrueCoords(e);
            
            if (mode === 'wall') {
                let snap = getSnapped(x, y);
                if (!isDrawing) {
                    isDrawing = true;
                    currentLine = { start: snap, end: snap };
                } else {
                    currentLine.end = snap;
                    lines.push({...currentLine});
                    isDrawing = false; currentLine = null;
                    update3D();
                }
            } else if (mode === 'door' || mode === 'window') {
                let nearest = findNearestLine(x, y);
                if (nearest) {
                    openings.push({
                        type: mode,
                        lineIndex: nearest.index,
                        ratio: nearest.ratio,
                        width: mode === 'door' ? 40 : 50 
                    });
                    update3D();
                }
            }
            draw2D();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDrawing && mode === 'wall') {
                let { x, y } = getTrueCoords(e);
                currentLine.end = getSnapped(x, y);
                draw2D();
            }
        });

        function findNearestLine(px, py) {
            let minDist = 30 / scale;
            let result = null;
            
            lines.forEach((l, index) => {
                const l2 = Math.pow(l.end.x - l.start.x, 2) + Math.pow(l.end.y - l.start.y, 2);
                if (l2 === 0) return;
                let t = Math.max(0, Math.min(1, ((px - l.start.x) * (l.end.x - l.start.x) + (py - l.start.y) * (l.end.y - l.start.y)) / l2));
                const projX = l.start.x + t * (l.end.x - l.start.x);
                const projY = l.start.y + t * (l.end.y - l.start.y);
                const dist = Math.hypot(px - projX, py - projY);
                
                if (dist < minDist) {
                    minDist = dist;
                    result = { index, ratio: t };
                }
            });
            return result;
        }

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineWidth = 4;
            
            ctx.strokeStyle = '#333';
            lines.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.start.x, l.start.y); ctx.lineTo(l.end.x, l.end.y); ctx.stroke();
            });

            if (currentLine) {
                ctx.strokeStyle = '#f44336';
                ctx.beginPath(); ctx.moveTo(currentLine.start.x, currentLine.start.y); ctx.lineTo(currentLine.end.x, currentLine.end.y); ctx.stroke();
            }

            openings.forEach(op => {
                let l = lines[op.lineIndex];
                if(!l) return;
                const cx = l.start.x + (l.end.x - l.start.x) * op.ratio;
                const cy = l.start.y + (l.end.y - l.start.y) * op.ratio;
                
                ctx.fillStyle = op.type === 'door' ? '#8B4513' : '#87CEEB';
                ctx.beginPath();
                ctx.arc(cx, cy, op.width/2, 0, Math.PI*2);
                ctx.fill();
            });
        }

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                imgElement.src = event.target.result;
                imgElement.onload = () => {
                    canvas.width = imgElement.width;
                    canvas.height = imgElement.height;
                    lines = []; openings = [];
                    draw2D(); update3D();
                }
            };
            reader.readAsDataURL(file);
        });

        // === 3D ENGINE (THREE.JS with ExtrudeGeometry) ===
        const rightPanel = document.getElementById('right-panel');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, rightPanel.clientWidth / rightPanel.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        renderer.setClearColor(0x2d2d2d);
        rightPanel.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x555555, 0x444444));
        
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);
        camera.position.set(0, 15, 15);

        window.addEventListener('resize', () => {
            camera.aspect = rightPanel.clientWidth / rightPanel.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(rightPanel.clientWidth, rightPanel.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        function update3D() {
            while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]); 

            const scale3D = 0.02;  
            const heightWall = 2.5; 
            const thickWall = 0.2; 

            const matWall = new THREE.MeshLambertMaterial({ color: 0xe0e0e0 });
            const matDoor = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const matWindow = new THREE.MeshLambertMaterial({ color: 0x87CEEB, transparent: true, opacity: 0.6 }); 

            lines.forEach((line, index) => {
                const dx = line.end.x - line.start.x;
                const dy = line.end.y - line.start.y;
                const length = Math.sqrt(dx*dx + dy*dy) * scale3D;
                const angle = Math.atan2(dy, dx);
                
                const midX = (line.start.x + line.end.x) / 2;
                const midY = (line.start.y + line.end.y) / 2;
                const posX = (midX - canvas.width / 2) * scale3D;
                const posZ = (midY - canvas.height / 2) * scale3D;

                const wallObj = new THREE.Group();
                
                // 1. Definisikan Shape Utama (Kotak Tembok Utuh 2D)
                const wallShape = new THREE.Shape();
                wallShape.moveTo(0, 0);
                wallShape.lineTo(length, 0);
                wallShape.lineTo(length, heightWall);
                wallShape.lineTo(0, heightWall);
                wallShape.lineTo(0, 0);

                // Filter & Sort posisi bukaan
                let ops = openings.filter(o => o.lineIndex === index).sort((a,b) => a.ratio - b.ratio);
                
                ops.forEach(op => {
                    const opWidth = op.width * scale3D;
                    const opCenter = length * op.ratio; // Titik tengah di sumbu X lokal tembok
                    const opStart = opCenter - opWidth/2;
                    const opEnd = opCenter + opWidth/2;
                    
                    const hole = new THREE.Path();
                    
                    if (op.type === 'door') {
                        const hDoor = 2.0;
                        // Gambar lubang potong untuk pintu (Path 2D)
                        hole.moveTo(opStart, 0);
                        hole.lineTo(opEnd, 0);
                        hole.lineTo(opEnd, hDoor);
                        hole.lineTo(opStart, hDoor);
                        hole.lineTo(opStart, 0);
                        
                        // Tambahkan panel kayunya
                        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(opWidth, hDoor, thickWall * 0.8), matDoor);
                        doorMesh.position.set(opCenter - length/2, hDoor/2, 0); 
                        doorMesh.rotation.y = Math.PI / 4; // Buka 45 derajat
                        wallObj.add(doorMesh);

                    } else if (op.type === 'window') {
                        const hWin = 1.2, yWin = 0.8;
                        // Gambar lubang potong untuk jendela (Path 2D)
                        hole.moveTo(opStart, yWin);
                        hole.lineTo(opEnd, yWin);
                        hole.lineTo(opEnd, yWin + hWin);
                        hole.lineTo(opStart, yWin + hWin);
                        hole.lineTo(opStart, yWin);
                        
                        // Tambahkan kaca jendela
                        const winMesh = new THREE.Mesh(new THREE.BoxGeometry(opWidth, hWin, thickWall * 0.5), matWindow);
                        winMesh.position.set(opCenter - length/2, yWin + hWin/2, 0);
                        wallObj.add(winMesh);
                    }
                    
                    // Masukkan ke array lubang (Boolean subtraksi otomatis)
                    wallShape.holes.push(hole);
                });

                // 2. Lakukan Extrude (Tarik bentuk 2D jadi 3D)
                const extrudeSettings = { depth: thickWall, bevelEnabled: false };
                const geometry = new THREE.ExtrudeGeometry(wallShape, extrudeSettings);
                const wallMesh = new THREE.Mesh(geometry, matWall);
                
                // Pusatkan kordinat pivotnya (Kompensasi karena extrude digambar dari X=0 & Z=0)
                wallMesh.position.set(-length/2, 0, -thickWall/2);
                wallObj.add(wallMesh);
                
                // 3. Taruh Grup Tembok di posisi sebenarnya sesuai Denah
                wallObj.position.set(posX, 0, posZ);
                wallObj.rotation.y = -angle;
                
                modelGroup.add(wallObj);
            });
        }

        document.getElementById('clearBtn').onclick = () => { lines = []; openings = []; draw2D(); update3D(); };
        
        document.getElementById('exportBtn').onclick = () => {
            new THREE.GLTFExporter().parse(modelGroup, (gltf) => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([gltf], { type: 'application/octet-stream' }));
                link.download = 'denah_3d_pro.glb';
                link.click();
            }, { binary: true });
        };
    </script>
</body>
</html>
