<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ArchiPlan 3D - Ultimate Web CAD (Fixed Gestures & Curves)</title>
    <style>
        :root { --bg: #1e1e1e; --panel: #252526; --accent: #007acc; --text: #e0e0e0; --danger: #da3633; --success: #2ea043; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; touch-action: none; }
        #header { padding: 10px 20px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        h1 { margin: 0; font-size: 16px; color: #fff; letter-spacing: 1px; }
        .controls { display: flex; gap: 8px; align-items: center; }
        button, input[type="file"]::file-selector-button { padding: 8px 12px; background-color: var(--accent); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.2s; }
        button:hover, input[type="file"]::file-selector-button:hover { filter: brightness(1.2); }
        button.action { background-color: var(--success); } button.danger { background-color: var(--danger); }
        button.tool.active { background-color: #ff9800; color: #000; }
        
        #main { display: flex; flex: 1; flex-direction: row; }
        #panel-2d { width: 450px; background: var(--bg); display: flex; flex-direction: column; padding: 15px; border-right: 1px solid #333; box-sizing: border-box; position: relative; z-index: 10;}
        .toolbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; justify-content: center; align-items: center; }
        canvas { background-color: #e0e0e0; cursor: crosshair; border-radius: 4px; touch-action: none; width: 100%; height: 400px; box-shadow: inset 0 0 10px rgba(0,0,0,0.1); }
        #panel-3d { flex: 1; position: relative; }
        .hint { font-size: 11px; color: #aaa; text-align: center; margin-bottom: 10px; line-height: 1.4; }
        
        .toggle-label { font-size: 11px; display:flex; align-items:center; gap:5px; background: #333; padding: 6px 10px; border-radius: 4px; cursor: pointer; border: 1px solid #555; }
        .toggle-label input { cursor: pointer; margin: 0; }
        
        #props-panel { display: none; background: #333; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #555; }
        #props-panel h3 { margin: 0 0 10px 0; font-size: 13px; color: #ff9800; }
        .prop-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; font-size: 12px;}
        .prop-row input[type="range"] { flex: 1; margin: 0 10px; }

        @media (max-width: 800px) { #main { flex-direction: column; } #panel-2d { width: 100%; height: 50%; padding: 10px; border-right: none; border-bottom: 2px solid #333; } canvas { height: 100%; max-height: 350px; } }
    </style>
</head>
<body>

    <div id="header">
        <h1>ArchiPlan 3D PRO</h1>
        <div class="controls">
            <input type="file" id="upload-image" accept="image/png, image/jpeg">
            <button id="btn-generate" class="action">Render 3D</button>
        </div>
    </div>

    <div id="main">
        <div id="panel-2d">
            <div class="toolbar">
                <button class="tool active" data-tool="wall">✏️ Tembok</button>
                <button class="tool" data-tool="curve">🌙 Curve</button>
                <button class="tool" data-tool="select">🖱️ Pilih/Edit</button>
                <button class="tool" data-tool="pan">🖐️ Pan</button>
            </div>
            <div class="toolbar">
                <button class="tool" data-tool="door">🚪 Pintu</button>
                <button class="tool" data-tool="window">🪟 Jendela</button>
                <button class="tool" data-tool="stairs">🪜 Tangga</button>
                <button class="tool" data-tool="bed">🛏️ Kasur</button>
                <button class="tool" data-tool="table">🪑 Meja</button>
            </div>
            
            <div class="toolbar" style="margin-bottom: 15px;">
                <label class="toggle-label">
                    <input type="checkbox" id="toggle-snap" checked> 🧲 Snap Ortho
                </label>
                <button id="btn-undo">↩ Undo</button>
                <button id="btn-clear-all" class="danger">Reset</button>
            </div>

            <p class="hint" id="tool-hint"><strong>Desktop:</strong> Scroll untuk Zoom, Klik Kanan selesai.<br><strong>Tablet:</strong> 2 Jari Zoom+Pan, Double Tap selesai.</p>
            <canvas id="floorplan" width="800" height="800"></canvas>

            <div id="props-panel">
                <h3 id="prop-title">Edit Objek</h3>
                <div class="prop-row">
                    <label>Ukuran:</label>
                    <input type="range" id="prop-width" min="0.5" max="4.0" step="0.1" value="1.0">
                    <span id="prop-width-val" style="width:40px; text-align:right;">1.0m</span>
                </div>
                <div class="prop-row">
                    <button id="btn-prop-flip" style="flex:1; margin-right:5px; background:#444;">🔄 Putar/Flip</button>
                    <button id="btn-prop-delete" class="danger" style="flex:1;">🗑️ Hapus</button>
                </div>
            </div>
        </div>
        <div id="panel-3d"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const canvas = document.getElementById('floorplan');
        const ctx = canvas.getContext('2d');
        const PIXELS_PER_METER = 50; 
        
        let bgImage = null; let walls = []; let currentPath = []; let objects = []; let historyStack = [];
        let currentTool = 'wall'; let hoverObject = null; let selectedObject = null;

        // Camera & Gestures
        let camZoom = 1; let camPanX = 0; let camPanY = 0;
        let mouseWorldPos = {x:0, y:0}; let snappedPoint = null; 
        
        let isPanning = false; let lastPan = {x:0, y:0};
        let isPinching = false; let initialPinchDist = 0; let initialZoom = 1; let lastMid = {x:0, y:0};
        let lastTapTime = 0;

        // Curved Wall State
        let curveStep = 0; let curveStart = null; let curveEnd = null;

        const defSize = { door: 1.0, window: 1.5, stairs: 1.5, bed: 1.8, table: 1.2 };

        function saveState() { historyStack.push({ walls: JSON.parse(JSON.stringify(walls)), objects: JSON.parse(JSON.stringify(objects)) }); }
        
        function getCanvasPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
        }
        function getWorldPos(canvasX, canvasY) {
            return { x: (canvasX - canvas.width/2) / camZoom + canvas.width/2 - camPanX, y: (canvasY - canvas.height/2) / camZoom + canvas.height/2 - camPanY };
        }

        // --- MATH & SNAPPING ---
        function getClosestPointOnLine(p, a, b) {
            const atob = { x: b.x - a.x, y: b.y - a.y }; const atop = { x: p.x - a.x, y: p.y - a.y };
            const lenSq = atob.x * atob.x + atob.y * atob.y; 
            let t = Math.min(1, Math.max(0, lenSq === 0 ? -1 : (atop.x * atob.x + atop.y * atob.y) / lenSq));
            return { x: a.x + atob.x * t, y: a.y + atob.y * t, angle: Math.atan2(atob.y, atob.x) };
        }

        function findWallSnap(pos) {
            let nearest = null; let minDist = 25 / camZoom; 
            walls.forEach(path => path.forEach(pt => { if (Math.hypot(pt.x - pos.x, pt.y - pos.y) < minDist) { minDist = Math.hypot(pt.x - pos.x, pt.y - pos.y); nearest = pt; } }));
            if (currentPath.length > 0 && Math.hypot(currentPath[0].x - pos.x, currentPath[0].y - pos.y) < minDist) { nearest = currentPath[0]; }
            if(!nearest) {
                walls.forEach(path => { for(let i=0; i<path.length-1; i++) {
                    let snap = getClosestPointOnLine(pos, path[i], path[i+1]);
                    if (Math.hypot(snap.x - pos.x, snap.y - pos.y) < minDist) { minDist = Math.hypot(snap.x - pos.x, snap.y - pos.y); nearest = snap; }
                }});
            }
            return nearest;
        }

        function applyOrthogonalSnap(lastPt, currentPt) {
            if(!document.getElementById('toggle-snap').checked) return currentPt;
            const dx = currentPt.x - lastPt.x; const dy = currentPt.y - lastPt.y;
            if (Math.abs(dx) > Math.abs(dy) * 1.5) return { x: currentPt.x, y: lastPt.y };
            if (Math.abs(dy) > Math.abs(dx) * 1.5) return { x: lastPt.x, y: currentPt.y };
            return currentPt;
        }

        // --- RENDER 2D ---
        function drawDimension(p1, p2, isDraft) {
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = isDraft ? 'rgba(0, 122, 204, 0.4)' : '#222'; 
            ctx.lineWidth = isDraft ? 6 : 10; ctx.stroke();
        }

        function drawObject(obj, isPreview=false) {
            ctx.save(); ctx.translate(obj.x, obj.y); ctx.rotate(obj.angle); 
            ctx.globalAlpha = isPreview ? 0.6 : 1.0;
            if (selectedObject === obj) { ctx.shadowColor = '#ff9800'; ctx.shadowBlur = 10; }
            let wPx = (obj.width || defSize[obj.type]) * PIXELS_PER_METER; let flip = obj.flip ? -1 : 1;

            if (obj.type === 'door') {
                ctx.fillStyle = '#8B4513'; ctx.fillRect(-wPx/2, -6, wPx, 12); ctx.beginPath(); ctx.arc(-wPx/2 * flip, -6 * flip, wPx, 0, Math.PI/2 * flip, flip<0); ctx.strokeStyle='#8B4513'; ctx.lineWidth=2; ctx.stroke();
            } else if (obj.type === 'window') {
                ctx.fillStyle = '#87CEFA'; ctx.fillRect(-wPx/2, -5, wPx, 10); ctx.strokeStyle = '#333'; ctx.lineWidth=2; ctx.strokeRect(-wPx/2, -5, wPx, 10);
            } else if (obj.type === 'stairs') {
                ctx.fillStyle = '#aaa'; ctx.fillRect(-wPx/2, -20, wPx, 40); ctx.strokeStyle='#333'; ctx.lineWidth=1;
                for(let i=-20; i<=20; i+=8) { ctx.beginPath(); ctx.moveTo(-wPx/2, i); ctx.lineTo(wPx/2, i); ctx.stroke(); }
            } else if (obj.type === 'bed') {
                ctx.fillStyle = '#6c5ce7'; ctx.fillRect(-wPx/2, -wPx*0.7, wPx, wPx*1.4); ctx.fillStyle = '#a29bfe'; ctx.fillRect(-wPx/2+5, -wPx*0.7+5, wPx-10, 20);
            } else if (obj.type === 'table') {
                ctx.fillStyle = '#d63031'; ctx.beginPath(); ctx.arc(0, 0, wPx/2, 0, Math.PI*2); ctx.fill();
            }
            ctx.restore();
        }

        function draw2D() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2); ctx.scale(camZoom, camZoom); ctx.translate(-canvas.width/2 + camPanX, -canvas.height/2 + camPanY);
            if (bgImage) { const scale = Math.min(canvas.width/bgImage.width, canvas.height/bgImage.height); ctx.globalAlpha = 0.4; ctx.drawImage(bgImage, canvas.width/2 - (bgImage.width*scale)/2, canvas.height/2 - (bgImage.height*scale)/2, bgImage.width*scale, bgImage.height*scale); ctx.globalAlpha = 1.0; }

            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            walls.forEach(path => { for (let i = 0; i < path.length - 1; i++) drawDimension(path[i], path[i+1], false); });
            
            if (currentTool === 'wall' && currentPath.length > 0) {
                for (let i = 0; i < currentPath.length - 1; i++) drawDimension(currentPath[i], currentPath[i+1], true);
                if (mouseWorldPos) {
                    let finalTarget = snappedPoint ? snappedPoint : applyOrthogonalSnap(currentPath[currentPath.length-1], mouseWorldPos);
                    drawDimension(currentPath[currentPath.length-1], finalTarget, true);
                }
                ctx.fillStyle = '#ff4500'; currentPath.forEach(pt => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2); ctx.fill(); });
            }

            // Render Curve Draft
            if (currentTool === 'curve' && curveStart) {
                ctx.strokeStyle = 'rgba(0, 122, 204, 0.4)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(curveStart.x, curveStart.y);
                if (curveStep === 1) { ctx.lineTo(mouseWorldPos.x, mouseWorldPos.y); }
                else if (curveStep === 2) { ctx.quadraticCurveTo(mouseWorldPos.x, mouseWorldPos.y, curveEnd.x, curveEnd.y); }
                ctx.stroke();
                ctx.fillStyle = '#ff4500'; ctx.beginPath(); ctx.arc(curveStart.x, curveStart.y, 6, 0, Math.PI*2); ctx.fill();
                if(curveEnd) { ctx.beginPath(); ctx.arc(curveEnd.x, curveEnd.y, 6, 0, Math.PI*2); ctx.fill(); }
            }

            if (snappedPoint && (currentTool === 'wall' || currentTool === 'curve')) { ctx.beginPath(); ctx.arc(snappedPoint.x, snappedPoint.y, 10, 0, Math.PI*2); ctx.strokeStyle = '#2ea043'; ctx.lineWidth = 3; ctx.stroke(); }

            objects.forEach(obj => drawObject(obj));
            if (hoverObject && currentTool !== 'select') drawObject(hoverObject, true);

            ctx.restore();
        }

        // --- INPUT HANDLERS (Separated for perfection) ---
        function handleInputDown(pos) {
            if (currentTool === 'pan') return;
            
            if (currentTool === 'wall') {
                let finalPos = snappedPoint ? {x: snappedPoint.x, y: snappedPoint.y} : (currentPath.length > 0 ? applyOrthogonalSnap(currentPath[currentPath.length-1], pos) : pos);
                currentPath.push(finalPos); 
            } 
            else if (currentTool === 'curve') {
                let finalPos = snappedPoint ? {x: snappedPoint.x, y: snappedPoint.y} : pos;
                if (curveStep === 0) { curveStart = finalPos; curveStep = 1; } 
                else if (curveStep === 1) { curveEnd = finalPos; curveStep = 2; } 
                else if (curveStep === 2) {
                    // Generate subdivided points for quadratic bezier
                    let pts = [];
                    for(let t=0; t<=1; t+=0.05) {
                        let x = (1-t)*(1-t)*curveStart.x + 2*(1-t)*t*pos.x + t*t*curveEnd.x;
                        let y = (1-t)*(1-t)*curveStart.y + 2*(1-t)*t*pos.y + t*t*curveEnd.y;
                        pts.push({x, y});
                    }
                    saveState(); walls.push(pts); curveStep = 0; curveStart = null; curveEnd = null; generate3D();
                }
            }
            else if (currentTool === 'select') {
                selectedObject = null;
                for(let i=objects.length-1; i>=0; i--) { if(Math.hypot(objects[i].x - pos.x, objects[i].y - pos.y) < 30/camZoom) { selectedObject = objects[i]; break; } }
                updatePropsPanel();
            }
            else if (hoverObject) { saveState(); objects.push({...hoverObject}); hoverObject = null; generate3D(); }
            draw2D();
        }

        function handleInputMove(pos) {
            mouseWorldPos = pos;
            if (['wall', 'curve'].includes(currentTool)) {
                snappedPoint = findWallSnap(mouseWorldPos);
            } else if (['door', 'window'].includes(currentTool)) {
                let nearest = null; let minDist = 30 / camZoom;
                walls.forEach(path => { for(let i=0; i<path.length-1; i++) {
                    let snap = getClosestPointOnLine(mouseWorldPos, path[i], path[i+1]);
                    if(Math.hypot(snap.x - mouseWorldPos.x, snap.y - mouseWorldPos.y) < minDist) { minDist = Math.hypot(snap.x - mouseWorldPos.x, snap.y - mouseWorldPos.y); nearest = snap; }
                }});
                hoverObject = nearest ? { ...nearest, type: currentTool, width: defSize[currentTool], flip: false } : null;
            } else if (['stairs', 'bed', 'table'].includes(currentTool)) {
                hoverObject = { type: currentTool, x: mouseWorldPos.x, y: mouseWorldPos.y, angle: 0, width: defSize[currentTool], flip: false };
            }
            draw2D();
        }

        // --- DESKTOP MOUSE EVENTS ---
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2) return; 
            let cp = getCanvasPos(e.clientX, e.clientY);
            if (e.button === 1 || currentTool === 'pan') { isPanning = true; lastPan = cp; return; }
            handleInputDown(getWorldPos(cp.x, cp.y));
        });
        canvas.addEventListener('mousemove', (e) => {
            let cp = getCanvasPos(e.clientX, e.clientY);
            if (isPanning) { camPanX += (cp.x - lastPan.x) / camZoom; camPanY += (cp.y - lastPan.y) / camZoom; lastPan = cp; draw2D(); return; }
            handleInputMove(getWorldPos(cp.x, cp.y));
        });
        canvas.addEventListener('mouseup', () => { isPanning = false; });
        canvas.addEventListener('wheel', (e) => { e.preventDefault(); camZoom = Math.max(0.2, Math.min(camZoom * (e.deltaY > 0 ? 0.9 : 1.1), 8)); draw2D(); });
        
        function finishWall() { if (currentPath.length > 1) { currentPath.pop(); saveState(); walls.push([...currentPath]); } currentPath = []; draw2D(); generate3D(); }
        canvas.addEventListener('contextmenu', (e) => { e.preventDefault(); finishWall(); }); 

        // --- IPAD TOUCH EVENTS ---
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            if (e.touches.length === 2) {
                isPinching = true; initialZoom = camZoom;
                let cp1 = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY); let cp2 = getCanvasPos(e.touches[1].clientX, e.touches[1].clientY);
                initialPinchDist = Math.hypot(cp1.x - cp2.x, cp1.y - cp2.y);
                lastMid = { x: (cp1.x + cp2.x)/2, y: (cp1.y + cp2.y)/2 };
                return;
            }
            if (e.touches.length === 1) {
                let now = Date.now();
                if (now - lastTapTime < 300 && currentTool === 'wall' && currentPath.length > 0) { finishWall(); lastTapTime = 0; return; }
                lastTapTime = now;
                let cp = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY);
                handleInputDown(getWorldPos(cp.x, cp.y));
            }
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isPinching && e.touches.length === 2) {
                let cp1 = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY); let cp2 = getCanvasPos(e.touches[1].clientX, e.touches[1].clientY);
                let dist = Math.hypot(cp1.x - cp2.x, cp1.y - cp2.y); let mid = { x: (cp1.x + cp2.x)/2, y: (cp1.y + cp2.y)/2 };
                camZoom = Math.max(0.2, Math.min(initialZoom * (dist / initialPinchDist), 8));
                camPanX += (mid.x - lastMid.x) / camZoom; camPanY += (mid.y - lastMid.y) / camZoom;
                lastMid = mid; draw2D(); return;
            }
            if (e.touches.length === 1 && !isPinching) {
                let cp = getCanvasPos(e.touches[0].clientX, e.touches[0].clientY); handleInputMove(getWorldPos(cp.x, cp.y));
            }
        }, {passive: false});
        canvas.addEventListener('touchend', (e) => { if(e.touches.length<2) isPinching = false; }, {passive: false});

        // --- PROPERTIES PANEL & UI ---
        const propsPanel = document.getElementById('props-panel'); const propWidth = document.getElementById('prop-width'); const propWidthVal = document.getElementById('prop-width-val');
        function updatePropsPanel() {
            if (selectedObject) {
                propsPanel.style.display = 'block'; document.getElementById('prop-title').innerText = `Edit ${selectedObject.type.toUpperCase()}`;
                propWidth.value = selectedObject.width || defSize[selectedObject.type]; propWidthVal.innerText = propWidth.value + 'm';
            } else { propsPanel.style.display = 'none'; }
        }
        propWidth.addEventListener('input', (e) => { if(selectedObject) { selectedObject.width = parseFloat(e.target.value); propWidthVal.innerText = e.target.value + 'm'; draw2D(); generate3D(); } });
        document.getElementById('btn-prop-flip').addEventListener('click', () => { if(selectedObject) { selectedObject.flip = !selectedObject.flip; selectedObject.angle += Math.PI/2; draw2D(); generate3D(); } });
        document.getElementById('btn-prop-delete').addEventListener('click', () => { if(selectedObject) { saveState(); objects = objects.filter(o => o !== selectedObject); selectedObject = null; updatePropsPanel(); draw2D(); generate3D(); } });

        document.querySelectorAll('.tool').forEach(btn => btn.addEventListener('click', (e) => { document.querySelectorAll('.tool').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); currentTool = e.target.dataset.tool; currentPath = []; curveStep=0; selectedObject = null; updatePropsPanel(); draw2D(); }));
        document.getElementById('upload-image').addEventListener('change', e => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{const i=new Image(); i.onload=()=>{bgImage=i;camZoom=1;camPanX=0;camPanY=0;draw2D();}; i.src=ev.target.result;}; r.readAsDataURL(f); });
        document.getElementById('btn-undo').addEventListener('click', () => { if (currentPath.length > 0) { currentPath.pop(); mouseWorldPos=null; draw2D(); } else if(curveStep > 0) { curveStep--; draw2D(); } else if (historyStack.length > 0) { let s = historyStack.pop(); walls = JSON.parse(JSON.stringify(s.walls)); objects = JSON.parse(JSON.stringify(s.objects)); draw2D(); generate3D(); } });
        document.getElementById('btn-clear-all').addEventListener('click', () => { saveState(); walls=[]; objects=[]; currentPath=[]; curveStep=0; bgImage=null; selectedObject=null; updatePropsPanel(); draw2D(); generate3D(); });

        draw2D();

        // --- 3D ENGINE ---
        const container3D = document.getElementById('panel-3d');
        const scene = new THREE.Scene(); scene.background = new THREE.Color('#dcdcdc');
        const camera = new THREE.PerspectiveCamera(50, container3D.clientWidth / container3D.clientHeight, 0.1, 1000); camera.position.set(0, 15, 20);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); renderer.setSize(container3D.clientWidth, container3D.clientHeight); renderer.shadowMap.enabled = true; container3D.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2;
        scene.add(new THREE.AmbientLight(0xffffff, 0.7)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.6); dirLight.position.set(20, 40, 20); dirLight.castShadow = true; scene.add(dirLight);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: '#e0e0e0', roughness:0.8 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
        let buildingGroup = new THREE.Group(); scene.add(buildingGroup);

        function generate3D() {
            scene.remove(buildingGroup); buildingGroup = new THREE.Group();
            const matWall = new THREE.MeshStandardMaterial({ color: '#ffffff' }); const matDoor = new THREE.MeshStandardMaterial({ color: '#5C3A21' }); const matWindow = new THREE.MeshPhysicalMaterial({ color: '#87CEEB', transmission: 0.8, opacity: 1, transparent: true, roughness: 0.1 }); const matWood = new THREE.MeshStandardMaterial({ color: '#d2b48c' }); const matFabric = new THREE.MeshStandardMaterial({ color: '#74b9ff' }); 
            const H = 3.2; const T = 0.2; const scale = 1 / PIXELS_PER_METER; 

            walls.forEach(path => {
                path.forEach(pt => { const m = new THREE.Mesh(new THREE.CylinderGeometry(T/2, T/2, H, 16), matWall); m.position.set((pt.x - canvas.width/2)*scale, H/2, (pt.y - canvas.height/2)*scale); buildingGroup.add(m); });
                for (let i = 0; i < path.length - 1; i++) {
                    let dx = path[i+1].x - path[i].x; let dy = path[i+1].y - path[i].y; let L = Math.hypot(dx, dy) * scale;
                    if (L < 0.05) continue; // Aman dari micro-segments dari tembok curve
                    let shape = new THREE.Shape(); shape.moveTo(0, 0); shape.lineTo(L, 0); shape.lineTo(L, H); shape.lineTo(0, H); shape.lineTo(0, 0);

                    objects.forEach(obj => {
                        let d1 = Math.hypot(obj.x - path[i].x, obj.y - path[i].y); let d2 = Math.hypot(obj.x - path[i+1].x, obj.y - path[i+1].y);
                        if (Math.abs((d1 + d2) - Math.hypot(dx, dy)) < 1.0 && (obj.type === 'door' || obj.type === 'window')) {
                            let Xc = d1 * scale; let hole = new THREE.Path(); let w = obj.width || defSize[obj.type];
                            if (obj.type === 'door') { hole.moveTo(Xc - w/2, 0); hole.lineTo(Xc - w/2, 2.1); hole.lineTo(Xc + w/2, 2.1); hole.lineTo(Xc + w/2, 0); hole.lineTo(Xc - w/2, 0); shape.holes.push(hole); } 
                            else if (obj.type === 'window') { hole.moveTo(Xc - w/2, 0.9); hole.lineTo(Xc - w/2, 0.9+1.2); hole.lineTo(Xc + w/2, 0.9+1.2); hole.lineTo(Xc + w/2, 0.9); hole.lineTo(Xc - w/2, 0.9); shape.holes.push(hole); }
                        }
                    });
                    const geometry = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false }); const m = new THREE.Mesh(geometry, matWall);
                    m.position.set((path[i].x - canvas.width/2)*scale, 0, (path[i].y - canvas.height/2)*scale); m.rotation.y = -Math.atan2(dy, dx); m.translateZ(-T/2); m.castShadow = true; m.receiveShadow = true; buildingGroup.add(m);
                }
            });

            objects.forEach(obj => {
                const px = (obj.x - canvas.width/2) * scale; const pz = (obj.y - canvas.height/2) * scale; let w = obj.width || defSize[obj.type]; let mesh = new THREE.Group();
                if (obj.type === 'door') { let door = new THREE.Mesh(new THREE.BoxGeometry(w, 2.1, T - 0.05), matDoor); door.position.y = 1.05; mesh.add(door);
                } else if (obj.type === 'window') { let win = new THREE.Mesh(new THREE.BoxGeometry(w, 1.2, 0.05), matWindow); win.position.y = 1.5; mesh.add(win);
                } else if (obj.type === 'stairs') { for(let i=0; i<10; i++) { let step=new THREE.Mesh(new THREE.BoxGeometry(w, 0.2, 0.3), matWood); step.position.set(0, i*0.2+0.1, i*0.3-1.5); step.castShadow=true; mesh.add(step); }
                } else if (obj.type === 'bed') { let base = new THREE.Mesh(new THREE.BoxGeometry(w, 0.4, w*1.4), matWood); base.position.y = 0.2; mesh.add(base); let mattress = new THREE.Mesh(new THREE.BoxGeometry(w-0.1, 0.2, w*1.3), matFabric); mattress.position.set(0, 0.5, 0.05); mesh.add(mattress);
                } else if (obj.type === 'table') { let top = new THREE.Mesh(new THREE.CylinderGeometry(w/2, w/2, 0.1, 32), matWood); top.position.y = 0.8; mesh.add(top); let leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8), matWall); leg.position.y = 0.4; mesh.add(leg); }
                mesh.position.set(px, 0, pz); mesh.rotation.y = -obj.angle; buildingGroup.add(mesh);
            });
            scene.add(buildingGroup);
        }
        document.getElementById('btn-generate').addEventListener('click', generate3D);
        window.addEventListener('resize', () => { camera.aspect = container3D.clientWidth / container3D.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(container3D.clientWidth, container3D.clientHeight); });
        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate(); draw2D();
    </script>
</body>
</html>
